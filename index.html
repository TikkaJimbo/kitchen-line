  for(let r=0;r<n-1;r++){
    const roundPairs=[];
    for(let i=0;i<n/2;i++) roundPairs.push([arr[i], arr[n-1-i]]);
    rounds.push(roundPairs);
    arr.splice(1,0,arr.pop());
  }
  return rounds;
}
function allTeamPairings(items){
  if(items.length===0) return [[]];
  if(items.length===2) return [[[items[0],items[1]]]];
  const [first,...rest] = items;
  const results=[];
  for(let i=0;i<rest.length;i++){
    const partner = rest[i];
    const remaining = rest.slice(0,i).concat(rest.slice(i+1));
    allTeamPairings(remaining).forEach(sp=> results.push([[first,partner], ...sp]));
  }
  return results;
}
function scoreArrangement(gamesArr, opponentCounts){
  let strengthCost=0, repeatCost=0;
  gamesArr.forEach(([teamX,teamY])=>{
    strengthCost += Math.abs(teamX._strength - teamY._strength);
    teamX.players.forEach(px=> teamY.players.forEach(py=>{
      repeatCost += (opponentCounts[px] && opponentCounts[px][py]) || 0;
    }));
  });
  return strengthCost + repeatCost*15; // one repeat opponent-encounter costs roughly as much as a 15-point strength gap
}
function pickBestArrangement(teams, opponentCounts){
  if(teams.length<2) return [];
  if(teams.length>8){
    // too many simultaneous games to brute-force every pairing; fall back to strength-sort only
    const sorted = teams.slice().sort((a,b)=>a._strength-b._strength);
    const games=[]; for(let i=0;i<sorted.length-1;i+=2) games.push([sorted[i],sorted[i+1]]);
    return games;
  }
  const candidates = allTeamPairings(teams);
  let best=null, bestScore=Infinity;
  candidates.forEach(arr=>{ const s=scoreArrangement(arr,opponentCounts); if(s<bestScore){ bestScore=s; best=arr; } });
  return best;
}
function recordOpponents(games, opponentCounts){
  games.forEach(([teamX,teamY])=>{
    teamX.players.forEach(px=> teamY.players.forEach(py=>{
      opponentCounts[px]=opponentCounts[px]||{}; opponentCounts[px][py]=(opponentCounts[px][py]||0)+1;
      opponentCounts[py]=opponentCounts[py]||{}; opponentCounts[py][px]=(opponentCounts[py][px]||0)+1;
    }));
  });
}
function partnershipKey(p1,p2){ return [p1,p2].sort().join("|"); }
function generateMixerRounds(players, ratingsMap, opponentCounts, usedPartnerships, sitOutCounts){
  // players: [{name,dupr}] -> rotates partners each round (round-robin partner schedule),
  // then picks the team-vs-team pairing within each round that minimizes strength mismatch
  // AND repeat opponent encounters together, tracked live via opponentCounts/usedPartnerships.
  ratingsMap = ratingsMap || {};
  opponentCounts = opponentCounts || {};
  usedPartnerships = usedPartnerships || new Set();
  sitOutCounts = sitOutCounts || {};
  const participants = players.map((p,i)=>({id:"mp-"+i, label:p.name, dupr:p.dupr}));
  const partnerRounds = roundRobinPairs(participants);
  const rounds = [];
  let lastRoundSitOut = new Set();
  partnerRounds.forEach((teamsRaw, ri)=>{
    const realPairs = teamsRaw.filter(pair=>!pair[0].bye && !pair[1].bye);
    const byePair = teamsRaw.find(pair=>pair[0].bye||pair[1].bye);
    const sitOut = [];
    if(byePair){
      const byeName = byePair[0].bye ? byePair[1].label : byePair[0].label;
      sitOut.push(byeName);
      sitOutCounts[byeName] = (sitOutCounts[byeName]||0)+1;
    }
    let teams = realPairs.map((pair,ti)=>{
      const r1 = ratingsMap[pair[0].label], r2 = ratingsMap[pair[1].label];
      const strength = ((r1!=null?r1:50) + (r2!=null?r2:50)) / 2;
      usedPartnerships.add(partnershipKey(pair[0].label, pair[1].label));
      return { id:"team-r"+ri+"-"+ti, label:pair[0].label+" & "+pair[1].label, players:[pair[0].label, pair[1].label], _strength: strength };
    });
    let thisRoundSitOut = new Set();
    if(teams.length%2!==0){
      // priority 1: whoever has sat out the FEWEST times so far (balance the total); priority 2: avoid repeating last round's sit-out
      let extraIdx = 0, bestScore = Infinity;
      for(let i=0;i<teams.length;i++){
        const team = teams[i];
        const countScore = team.players.reduce((s,p)=>s+(sitOutCounts[p]||0), 0);
        const consecutivePenalty = team.players.some(p=>lastRoundSitOut.has(p)) ? 1000 : 0;
        const score = countScore + consecutivePenalty;
        if(score < bestScore){ bestScore = score; extraIdx = i; }
      }
      const extra = teams.splice(extraIdx,1)[0];
      sitOut.push(...extra.players);
      extra.players.forEach(p=>{ sitOutCounts[p] = (sitOutCounts[p]||0)+1; });
      thisRoundSitOut = new Set(extra.players);
    }
    lastRoundSitOut = thisRoundSitOut;
    const arrangement = pickBestArrangement(teams, opponentCounts);
    recordOpponents(arrangement, opponentCounts);
    const matches = arrangement.map((pair,gi)=>{
      const aClean = {id:pair[0].id, label:pair[0].label, players:pair[0].players};
      const bClean = {id:pair[1].id, label:pair[1].label, players:pair[1].players};
      return {id:"mx-"+ri+"-"+gi, round:ri+1, a:aClean, b:bClean, scoreA:null, scoreB:null, winner:null, isBye:false};
    });
    rounds.push({round:ri+1, matches, sitOut});
  });
  return rounds;
}
function previewPartnershipOverlap(shuffledPlayers, maxGamesNeeded, usedPartnerships){
  const participants = shuffledPlayers.map((p,i)=>({id:"x"+i, label:p.name}));
  const partnerRounds = roundRobinPairs(participants);
  let overlap=0, gamesSoFar=0;
  for(const teamsRaw of partnerRounds){
    if(gamesSoFar>=maxGamesNeeded) break;
    const realPairs = teamsRaw.filter(pair=>!pair[0].bye && !pair[1].bye);
    realPairs.forEach(pair=>{ if(usedPartnerships.has(partnershipKey(pair[0].label,pair[1].label))) overlap++; });
    gamesSoFar += Math.floor(realPairs.length/2);
  }
  return overlap;
}
function buildTrackersFromMixerRounds(mixerRounds){
  const opponentCounts = {};
  const usedPartnerships = new Set();
  const sitOutCounts = {};
  mixerRounds.forEach(r=>{
    (r.sitOut||[]).forEach(p=>{ sitOutCounts[p] = (sitOutCounts[p]||0)+1; });
    r.matches.forEach(m=>{
      usedPartnerships.add(partnershipKey(m.a.players[0], m.a.players[1]));
      usedPartnerships.add(partnershipKey(m.b.players[0], m.b.players[1]));
      m.a.players.forEach(px=> m.b.players.forEach(py=>{
        opponentCounts[px]=opponentCounts[px]||{}; opponentCounts[px][py]=(opponentCounts[px][py]||0)+1;
        opponentCounts[py]=opponentCounts[py]||{}; opponentCounts[py][px]=(opponentCounts[py][px]||0)+1;
      }));
    });
  });
  return {opponentCounts, usedPartnerships, sitOutCounts};
}
function computeMixerStandings(playerNames, mixerRounds){
  const table={};
  playerNames.forEach(n=> table[n]={id:n, label:n, played:0, won:0, lost:0, pf:0, pa:0, pts:0});
  mixerRounds.forEach(r=> r.matches.forEach(m=>{
    if(m.scoreA==null || m.scoreB==null) return;
    const aWin = m.scoreA>m.scoreB;
    m.a.players.forEach(pn=>{ const t=table[pn]; if(!t) return; t.played++; t.pf+=m.scoreA; t.pa+=m.scoreB; if(aWin){t.won++; t.pts++;} else t.lost++; });
    m.b.players.forEach(pn=>{ const t=table[pn]; if(!t) return; t.played++; t.pf+=m.scoreB; t.pa+=m.scoreA; if(!aWin){t.won++; t.pts++;} else t.lost++; });
  }));
  return Object.values(table).sort((x,y)=> y.pts-x.pts || (y.pf-y.pa)-(x.pf-x.pa) || y.pf-x.pf);
}
function computeStandings(participants, matches){
  const table = {};
  participants.forEach(p=>{ if(p.bye) return; table[p.id]={id:p.id, label:p.label, played:0, won:0, lost:0, pf:0, pa:0, pts:0}; });
  matches.forEach(m=>{
    if(m.isBye || m.winner==null || m.scoreA==null || m.scoreB==null) return;
    const A=table[m.a.id], B=table[m.b.id];
    if(!A||!B) return;
    A.played++; B.played++;
    A.pf+=m.scoreA; A.pa+=m.scoreB;
    B.pf+=m.scoreB; B.pa+=m.scoreA;
    if(m.winner===A.id){ A.won++; B.lost++; A.pts+=1; } else { B.won++; A.lost++; B.pts+=1; }
  });
  return Object.values(table).sort((x,y)=> y.pts-x.pts || (y.pf-y.pa)-(x.pf-x.pa) || y.pf-x.pf);
}
function makeGroups(participants, groupSize){
  const groupCount = Math.max(1, Math.round(participants.length/groupSize));
  let sorted = participants.slice();
  const hasDupr = sorted.some(p=>p.dupr);
  sorted = hasDupr ? sorted.sort((a,b)=>(b.dupr||0)-(a.dupr||0)) : shuffle(sorted);
  const groups = Array.from({length:groupCount}, ()=>[]);
  let dir=1, g=0;
  sorted.forEach(p=>{
    groups[g].push(p);
    if(dir===1){ if(g===groupCount-1) dir=-1; else g++; }
    else { if(g===0) dir=1; else g--; }
  });
  return groups.map((gp,i)=>({
    id:"G"+(i+1), name:"Group "+String.fromCharCode(65+i),
    participants:gp, matches: generateRoundRobin(gp)
  }));
}
function makeBracket(qualifiers){
  let list = qualifiers.slice();
  let size=1; while(size<list.length) size*=2;
  while(list.length<size) list.push({id:"BYE-"+list.length+"-"+Math.random().toString(36).slice(2,5), label:"Bye", bye:true});
  const rounds=[];
  const first=[];
  for(let i=0;i<size/2;i++){
    const a=list[i], b=list[size-1-i];
    first.push({
      id:"ko-1-"+i, round:1, a, b, scoreA:null, scoreB:null,
      winner: a.bye ? b.id : (b.bye ? a.id : null), isBye: !!(a.bye||b.bye)
    });
  }
  rounds.push(first);
  let count = first.length;
  let r=2;
  while(count>1){
    count/=2;
    const rm=[];
    for(let i=0;i<count;i++) rm.push({id:"ko-"+r+"-"+i, round:r, a:null, b:null, scoreA:null, scoreB:null, winner:null, isBye:false});
    rounds.push(rm); r++;
  }
  propagateBracket(rounds);
  propagateBracket(rounds);
  propagateBracket(rounds);
  return rounds;
}
function propagateBracket(rounds){
  for(let r=0;r<rounds.length-1;r++){
    rounds[r].forEach((m,i)=>{
      if(m.winner){
        const winnerObj = (m.a && m.winner===m.a.id) ? m.a : m.b;
        const next = rounds[r+1][Math.floor(i/2)];
        const slot = i%2===0 ? "a" : "b";
        next[slot] = winnerObj;
        if(next.a && next.b){
          if(next.a.bye) next.winner = next.b.id;
          else if(next.b.bye) next.winner = next.a.id;
        }
      }
    });
  }
}
function groupMatchesByRound(matches){
  const byRound = {};
  matches.forEach(m=>{ (byRound[m.round]=byRound[m.round]||[]).push(m); });
  return Object.keys(byRound).sort((a,b)=>a-b).map(k=>byRound[k]);
}
function fillRoundRobinToTarget(participants, targetGames){
  if(participants.length<2) return generateRoundRobin(participants);
  let allMatches = [];
  let realCount = 0;
  let cycle = 0;
  while(realCount < targetGames && cycle < 10){
    const cycleMatches = generateRoundRobin(participants);
    const maxRound = allMatches.length ? Math.max(...allMatches.map(m=>m.round)) : 0;
    const roundsGrouped = groupMatchesByRound(cycleMatches);
    for(const roundMatches of roundsGrouped){
      if(realCount >= targetGames) break;
      const newRoundNum = roundMatches[0].round + maxRound;
      const byes = roundMatches.filter(m=>m.isBye);
      let real = roundMatches.filter(m=>!m.isBye);
      const remaining = targetGames - realCount;
      if(real.length > remaining) real = real.slice(0, remaining);
      const finalRoundMatches = real.concat(byes);
      finalRoundMatches.forEach(m=>{ m.round = newRoundNum; m.id = m.id+"-c"+cycle; });
      allMatches = allMatches.concat(finalRoundMatches);
      realCount += real.length;
    }
    cycle++;
  }
  return allMatches;
}
function fillMixerToTarget(players, targetGames, ratingsMap){
  if(players.length<4) return generateMixerRounds(players, ratingsMap, {}, new Set(), {});
  const opponentCounts = {};
  const usedPartnerships = new Set();
  const sitOutCounts = {};
  let rounds = [];
  let realCount = 0;
  let cycle = 0;
  while(realCount < targetGames && cycle < 10){
    let order;
    if(cycle===0){
      order = shuffle(players);
    } else {
      let bestOrder=null, bestOverlap=Infinity;
      for(let attempt=0; attempt<8; attempt++){
        const candidate = shuffle(players);
        const overlap = previewPartnershipOverlap(candidate, targetGames-realCount, usedPartnerships);
        if(overlap<bestOverlap){ bestOverlap=overlap; bestOrder=candidate; }
        if(bestOverlap===0) break;
      }
      order = bestOrder;
    }
    const cycleRounds = generateMixerRounds(order, ratingsMap, opponentCounts, usedPartnerships, sitOutCounts);
    const maxRound = rounds.length ? Math.max(...rounds.map(r=>r.round)) : 0;
    for(const r of cycleRounds){
      if(realCount >= targetGames) break;
      const newRoundNum = r.round + maxRound;
      let matches = r.matches;
      const sitOut = r.sitOut.slice();
      const remaining = targetGames - realCount;
      if(matches.length > remaining){
        const dropped = matches.slice(remaining);
        matches = matches.slice(0, remaining);
        dropped.forEach(m=>{ sitOut.push(...m.a.players, ...m.b.players); });
      }
      matches.forEach(m=>{ m.round = newRoundNum; m.id = m.id+"-c"+cycle; });
      rounds.push({round:newRoundNum, matches, sitOut});
      realCount += matches.length;
    }
    cycle++;
  }
  return rounds;
}
function buildFairnessMap(){
  const map = {};
  state.playerDb.forEach(p=>{ if(p.fairness!=null) map[p.name] = p.fairness; });
  return map;
}
function recommendedMaxMatches(duration, gameLen, courts){
  return Math.max(1, Math.floor(duration/gameLen) * courts);
}

          <input type="date" id="f-date" value="${f.date}">

          <label>Total playing duration (minutes)</label>

          <select id="f-gameLen">

        <div class="chip-group">
          <div class="chip ${f.matchType==="singles"?"active":""}" data-action="set-matchtype" data-val="singles">Singles</div>
          <div class="chip ${f.matchType==="doubles"?"active":""}" data-action="set-matchtype" data-val="doubles" style="${oddDoubles?'opacity:0.4;cursor:not-allowed;':''}">Doubles (fixed teams)</div>
          <div class="chip ${f.matchType==="mixer"?"active":""}" data-action="set-matchtype" data-val="mixer">Doubles (rotating partners)</div>
        </div>
        ${oddDoubles ? `<p class="help">Odd number of players on the list &mdash; fixed teams needs an even count, so only rotating partners is available for doubles right now.</p>` : ""}
        ${f.matchType==="mixer" ? `<p class="help">Everyone partners with everyone in turn &mdash; teams are reshuffled each round. Best social format for a casual crew of 8+.</p>` : ""}
      </div>
      ${f.matchType!=="mixer" ? `
      <div class="field">
        <label>Format</label>
        <div class="chip-group">
          <div class="chip ${f.format==="roundrobin"?"active":""}" data-action="set-format" data-val="roundrobin">Round robin (league)</div>
          <div class="chip ${f.format==="groups"?"active":""}" data-action="set-format" data-val="groups">Groups + knockout</div>
          <div class="chip ${f.format==="freeplay"?"active":""}" data-action="set-format" data-val="freeplay">Freeplay &mdash; pick your own matchups</div>
        </div>
        ${f.format==="roundrobin" && nParticipants===2 ? `<p class="help">Just 2 ${f.matchType==="doubles"?"teams":"players"} &mdash; this becomes a <b>Match Series</b>: the same head-to-head repeats until your time runs out, tallying wins.</p>` : ""}
        ${f.format==="freeplay" ? `<p class="help">No schedule gets built up front. Add each match live from the session page as you play &mdash; ${f.matchType==="doubles"?"pick any 2v2 combo each time, no fixed teams needed":"pick who's playing each time"}.</p>` : ""}
      </div>` : ""}
      ${f.matchType!=="mixer" && f.format==="groups" ? `
      <div class="row">
        <div class="field">
          <label>Players per group</label>
          <input type="number" id="f-groupSize" min="3" max="6" value="${f.groupSize}">
        </div>
        <div class="field">
          <label>Advance per group</label>
          <select id="f-advancePerGroup">
            <option value="1" ${f.advancePerGroup==1?"selected":""}>Top 1</option>
            <option value="2" ${f.advancePerGroup==2?"selected":""}>Top 2</option>
          </select>
        </div>
      </div>` : ""}
      <div class="field" style="margin-top:16px;">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; text-transform:none; letter-spacing:0; font-size:14px;" data-action="toggle-crown-champion">
          <input type="checkbox" id="f-crownChampion" ${f.crownChampion?"checked":""} style="width:18px; height:18px; accent-color:var(--court);">
          Crown a champion for this session
        </label>
        <p class="help">${f.matchType==="doubles"?"The best-performing team gets counted as champion":"The best-performing player gets counted as champion"} on their profile. Turn off for a purely social, no-standings session.</p>
      </div>
    </div>

    <div class="card">
      <p class="eyebrow">Step 2</p>
      <h2>Who's playing?</h2>
      <p class="sub">Names are remembered for next time &mdash; start typing to pull up regulars. DUPR is optional.</p>
      ${state.playerLists && state.playerLists.length ? `
      <div class="join-row" style="margin-bottom:16px;">
        <select id="load-list-select">${state.playerLists.map(l=>`<option value="${l.id}">${l.name} (${l.players.length})</option>`).join("")}</select>
        <button class="btn btn-outline" data-action="load-player-list">Load list</button>
      </div>` : ""}
      <div class="player-add-row">
        <div class="field">
          <label>Player name</label>
          <input type="text" id="p-name" list="playerNames" placeholder="e.g. Nadeesha Perera">
          <datalist id="playerNames">
            ${state.playerDb.map(p=>`<option value="${p.name}">`).join("")}
          </datalist>
        </div>
        <div class="field dupr">
          <label>DUPR</label>
          <input type="text" id="p-dupr" placeholder="3.5">
        </div>
        <button class="btn btn-ink btn-sm" data-action="add-player" style="height:44px;">Add</button>
      </div>
      <div class="player-list">
        ${f.players.length===0 ? `<div class="empty">No players yet. Add at least 2 to get started.</div>` :
          f.players.map((p,i)=> state.form.replacingIdx===i ? `
            <div class="player-pill" style="flex-direction:column; align-items:stretch; gap:8px;">
              <p class="eyebrow" style="margin:0;">Replace ${p.name} with&hellip;</p>
              <div class="player-add-row" style="margin-bottom:0;">
                <div class="field"><input type="text" id="replace-name" list="playerNames" placeholder="New player name"></div>
                <div class="field dupr"><input type="text" id="replace-dupr" placeholder="DUPR"></div>
              </div>
              <div class="chip-group">
                <button class="btn btn-ink btn-sm" data-action="save-replace-player" data-idx="${i}">Save</button>
                <button class="btn btn-outline btn-sm" data-action="cancel-replace-player">Cancel</button>
              </div>
            </div>` : `
            <div class="player-pill">
              <div><span class="name">${p.name}</span>${p.dupr ? `<span class="dupr-tag">DUPR ${p.dupr}</span>`:""}</div>
              <div class="chip-group" style="gap:10px;">
                <button class="remove-btn" data-action="start-replace-player" data-idx="${i}" style="color:var(--court);">Replace</button>
                <button class="remove-btn" data-action="remove-player" data-idx="${i}">Remove</button>
              </div>
            </div>`).join("")}
      </div>
      ${f.matchType==="doubles" && f.players.length>0 ? `<p class="help">${f.players.length % 2 !== 0 ? "Odd number of players — add one more for even doubles teams." : nParticipants+" teams once paired."}</p>` :
        f.matchType==="mixer" && f.players.length>0 ? `<p class="help">${f.players.length} players &middot; ~${Math.floor(f.players.length/4)} game${Math.floor(f.players.length/4)===1?"":"s"} per rotation &mdash; rotations repeat automatically to fill your time window (${rec} match slots).</p>` :
        (f.players.length>1 ? `<p class="help">${roundRobinTotal} match${roundRobinTotal===1?"":"es"} per full cycle among ${f.players.length} players &mdash; repeats automatically to fill your time window (${rec} match slots).</p>` : "")}
      ${f.players.length>=3 ? (
        f.playersConfirmed
          ? `<p class="help" style="color:var(--court);">&#10003; Players confirmed.</p>`
          : `<button class="btn btn-outline btn-sm" style="margin-top:10px;" data-action="confirm-players">Done adding players</button>`
      ) : ""}
    </div>

    ${f.matchType==="doubles" && f.format!=="freeplay" ? renderPairingSection() : ""}

    <button class="btn btn-ball btn-wide" data-action="build-tournament" ${state.loading ? "disabled":""}>
      ${state.loading ? "Building…" : "Generate court code & bracket"}
    </button>
  `;
}

function renderPairingSection(){
  const f = state.form;
  const paired = new Set(f.teams.flat());
  const unpaired = f.players.filter(p=>!paired.has(p.name));
  const selecting = f.pairSelection!==null;
  return `
    <div class="card">
      <p class="eyebrow">Step 3</p>
      <h2>Pair up teams</h2>
      <p class="sub">Tap a player, then tap their partner to link them as a team.</p>

      ${selecting ? `<p class="help" style="color:var(--court);">${f.pairSelection} selected &mdash; now tap their partner.</p>` : ""}
      <div class="chip-group" style="margin-bottom:18px;">
        ${unpaired.map(p=>`<div class="pair-chip ${state.form.pairSelection===p.name?"selected":""}" data-action="pick-pair" data-name="${p.name}">${p.name}</div>`).join("") || "<span class='help'>All players paired.</span>"}
      </div>

      ${f.teams.length ? `
        <p class="eyebrow" style="margin-top:4px;">Teams so far</p>
        ${f.teams.map((t,i)=>`
          <div class="team-row">
            <span>${t[0]} &amp; ${t[1]}</span>
            <button class="remove-btn" data-action="remove-team" data-idx="${i}">Undo</button>
          </div>`).join("")}
      ` : ""}

      <p class="eyebrow" style="margin-top:18px;">Or auto-pair everyone</p>
      <div class="chip-group">
        <button class="btn btn-outline btn-sm" data-action="autopair-balanced">Balanced by DUPR</button>
        <button class="btn btn-outline btn-sm" data-action="autopair-random">Random</button>
        <button class="btn btn-outline btn-sm" data-action="clear-pairs">Clear all teams</button>
      </div>
    </div>
  `;
}

/* ============================= VIEW / LIVE BRACKET ============================= */
function renderView(){
  if(state.loading) return `<div class="empty">Loading tournament…</div>`;
  const t = state.tournament;
  if(!t) return `
    <div class="card">
      <h2>Can't find that court code</h2>
      <p class="sub">Double-check the code and try again.</p>
      <div class="join-row">
        <input type="text" id="joinCodeInput2" maxlength="6" placeholder="e.g. 7QXPB">
        <button class="btn btn-ink" data-action="join2">Go</button>
      </div>
    </div>`;

  let body = "";
  let champion = null;
  let championStatusLabel = "Champion";
  let crossoverStandings = null;
  const ended = t.ended === true;

  if(t.format==="mixer" || (t.format==="freeplay" && t.freeplayMode==="doubles")){
    const playerNames = t.participants.map(p=>p.label);
    const standings = computeMixerStandings(playerNames, t.mixerRounds);
    const allDone = t.mixerRounds.every(r=>r.matches.every(m=>m.scoreA!=null && m.scoreB!=null));
    const finalized = allDone || ended;
    if(championEnabled(t) && standings.length){
      if(finalized){ champion = standings[0]; championStatusLabel = "Champion"; }
      else if(t.format==="freeplay"){ champion = standings[0]; championStatusLabel = "Leading"; }
    }
    crossoverStandings = t.format==="mixer" ? standings : null;
    body += renderStandingsTable(standings);
    if(t.format==="freeplay"){
      if(!ended) body += renderFreeplayAddMatch(t);
      if(t.mixerRounds[0].matches.length){
        body += `<div class="round-label">Matches played</div>`;
        t.mixerRounds[0].matches.slice().reverse().forEach(m=> body += renderMatchCard(m, t, "mx", !ended));
      }
    } else {
      t.mixerRounds.forEach(r=>{
        body += `<div class="round-label">Round ${r.round}${r.sitOut.length ? " — sitting out: "+r.sitOut.join(", ") : ""}</div>`;
        r.matches.forEach(m=> body += renderMatchCard(m, t, "mx", !ended));
      });
    }
  } else if(t.format==="roundrobin" || (t.format==="freeplay" && t.freeplayMode==="singles")){
    const standings = computeStandings(t.participants, t.matches);
    const finalized = (t.format==="roundrobin" && allMatchesDone(t.matches)) || ended;
    if(championEnabled(t) && standings.length){
      if(finalized){ champion = standings[0]; championStatusLabel = "Champion"; }
      else if(t.format==="freeplay"){ champion = standings[0]; championStatusLabel = "Leading"; }
    }
    if(t.matchType==="singles" && t.format!=="freeplay") crossoverStandings = standings;
    body += renderStandingsTable(standings);
    if(t.format==="freeplay"){
      if(!ended) body += renderFreeplayAddMatch(t);
      if(t.matches.length){
        body += `<div class="round-label">Matches played</div>`;
        t.matches.slice().reverse().forEach(m=> body += renderMatchCard(m, t, "rr", !ended));
      }
    } else {
      body += renderMatchList(t.matches, t, null, !ended);
    }
  } else {
    // groups + knockout
    const allGroupMatches = t.groups.flatMap(g=>g.matches);
    body += `<div class="round-label">Group stage</div>`;
    t.groups.forEach(g=>{
      const st = computeStandings(g.participants, g.matches);
      body += `<div class="group-block"><h3>${g.name}</h3>${renderStandingsTable(st, t.advancePerGroup)}</div>`;
    });
    body += renderMatchList(allGroupMatches, t, "grp", !ended);
    body += `<div class="round-label" style="margin-top:24px;">Knockout</div>`;
    if(!t.bracket){
      const groupsDone = t.groups.every(g=>allMatchesDone(g.matches));
      if(groupsDone && !ended){
        body += `<div class="empty">Group stage complete. <br><button class="btn btn-ink btn-sm" style="margin-top:10px;" data-action="start-knockout">Seed the knockout bracket</button></div>`;
      } else if(!ended){
        body += `<div class="empty">Bracket unlocks once every group match has a score.</div>`;
      }
    } else {
      t.bracket.forEach((round,ri)=>{
        body += `<div class="round-label">${bracketRoundName(ri, t.bracket.length)}</div>`;
        body += renderMatchList(round, t, "ko", !ended);
      });
      const finalRound = t.bracket[t.bracket.length-1];
      if(finalRound && finalRound.length===1 && finalRound[0].winner && !finalRound[0].isBye && championEnabled(t)){
        const wId = finalRound[0].winner;
        const wObj = finalRound[0].a.id===wId ? finalRound[0].a : finalRound[0].b;
        champion = {label: wObj.label};
        championStatusLabel = "Champion";
      }
    }
  }

  if(crossoverStandings && !ended) body += renderCrossoverSection(t, crossoverStandings);
  else if(t.crossoverFinal) body += `<div class="round-label">Crossover Final</div>${renderMatchCard(t.crossoverFinal, t, "cx", !ended)}`;

  const canAddMore = !ended && (t.format==="mixer" || t.format==="roundrobin" || (t.format==="groups" && !t.bracket));

  return `
    <button class="back-link" data-action="go-home">&larr; Back</button>
    <div class="thead">
      <div>
        <h2 class="display" style="font-size:26px;"><span class="player-link" data-action="view-location" data-name="${t.location}">${t.location}</span></h2>
        <div class="meta">
          <span>${t.date}</span>
          <span>${t.matchType==="doubles"?"Doubles":t.matchType==="mixer"?"Doubles (rotating)":"Singles"}</span>
          <span>${formatLabel(t)}</span>
          ${ended ? `<span style="color:var(--red);">&#9679; Session ended</span>` : ""}
        </div>
      </div>
      <div class="code-pill">${t.code}</div>
    </div>
    ${canAddMore ? `<button class="btn btn-outline btn-sm" data-action="add-more-games" style="margin-bottom:14px;">+ Add another round of games</button>` : ""}
    ${!ended && t.format!=="groups" ? renderAddPlayerToSession(t) : ""}
    ${!ended && (t.format==="roundrobin" || t.format==="mixer") ? renderManualAddMatch(t) : ""}
    ${champion ? `<div class="champion-banner"><div class="lbl">🏆 ${championStatusLabel}</div><div class="name">${champion.label}</div></div>` : ""}
    ${t.crossoverFinal && t.crossoverFinal.winner ? `<div class="champion-banner" style="background:var(--kitchen);"><div class="lbl">🎾 Crossover Final Winner</div><div class="name">${(t.crossoverFinal.a.id===t.crossoverFinal.winner ? t.crossoverFinal.a : t.crossoverFinal.b).label}</div></div>` : ""}
    ${renderAchievements(t)}
    ${renderSessionPredictionsReport(t)}
    ${renderKitchenRatings(t)}
    ${renderPredictionsToggle()}
    ${renderDifficultyToggle()}
    ${body}
    <div class="chip-group" style="margin-top:10px;">
      <button class="btn btn-outline btn-sm" data-action="copy-link-view">Copy shareable link</button>
      <button class="btn btn-outline btn-sm" data-action="copy-code-view">Copy code</button>
      <button class="btn btn-outline btn-sm" data-action="share-whatsapp-view">Share on WhatsApp</button>
      <button class="btn btn-ink btn-sm" data-action="generate-result-card">📸 Result card</button>
      ${!ended ? `<button class="btn btn-outline btn-sm" style="border-color:var(--red); color:var(--red);" data-action="end-session">End session</button>` : ""}
    </div>
  `;
}

function renderProfile(){
  if(state.loading) return `<div class="empty">Loading profile…</div>`;
  const p = state.profile;
  if(!p) return `<button class="back-link" data-action="go-back-from-profile">&larr; Back</button><div class="card"><h2>No record yet</h2><p class="sub">This player hasn't appeared in a saved tournament, or the name doesn't match exactly.</p></div>`;
  return `
    <button class="back-link" data-action="go-back-from-profile">&larr; Back</button>
    <div class="card">
      <div class="profile-head">
        <div class="profile-avatar">${p.name.charAt(0).toUpperCase()}</div>
        <div>
          <h2 style="margin-bottom:0;">${p.name}</h2>
          <p class="sub" style="margin:2px 0 0;">${p.dupr ? "DUPR "+p.dupr : "No DUPR on file"} &middot; ${p.tournamentCount} session${p.tournamentCount===1?"":"s"} &middot; ${p.totalMatches} game${p.totalMatches===1?"":"s"}${p.avgRating!=null ? ` &middot; \u2b50 ${p.avgRating.toFixed(1)} avg rating` : ""}</p>
        </div>
      </div>
    </div>
    ${renderTypickleProfileHistory()}
    ${renderPassport(p)}
    ${renderAchievementBreakdown(p)}
    ${renderCareerBadges(p)}
    ${renderRatingChart(p)}
    ${p.singles ? renderCategoryBlock("Singles", "🎾", p.singles, false) : ""}
    ${p.doubles ? renderCategoryBlock("Doubles", "🤝", p.doubles, true) : ""}
    <div class="card">
      <p class="eyebrow">Recent sessions</p>
      ${p.history.length ? p.history.map(h=>`
        <div class="history-row">
          <div><span class="loc">${h.location}</span> &middot; ${h.date}</div>
          <div><span class="rec">${h.won}-${h.lost}</span> &middot; <span class="player-link" data-action="view-profile-code" data-code="${h.code}">${h.code}</span></div>
        </div>`).join("") : `<p class="help">No completed matches logged yet.</p>`}
    </div>
  `;
}

function renderTypickleProfileHistory(){
  const hist = state.profileTypickleHistory;
  if(!hist || !hist.length) return "";
  const totalPlayed = hist.reduce((s,h)=>s+h.played,0);
  const totalWins = hist.reduce((s,h)=>s+h.wins,0);
  const totalLosses = hist.reduce((s,h)=>s+h.losses,0);
  const totalDiff = hist.reduce((s,h)=>s+h.diff,0);
  return `
    <div class="card" style="background:var(--court); border-color:var(--ink);">
      <p class="eyebrow" style="color:var(--ball);">Powered by Typickle Events</p>
      <h2 style="color:#fff;">Tournament History</h2>
      <p class="sub" style="color:#DCEDEA;">Kept separate from recreational Kitchen Line stats.</p>
      <div class="stat-grid cols-4" style="margin-top:12px;">
        <div class="stat-tile" style="background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.2);"><div class="num" style="color:var(--kitchen);">${totalPlayed}</div><div class="lbl" style="color:#B9CFCB;">Matches</div></div>
        <div class="stat-tile" style="background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.2);"><div class="num" style="color:var(--kitchen);">${totalWins}-${totalLosses}</div><div class="lbl" style="color:#B9CFCB;">W-L</div></div>
        <div class="stat-tile" style="background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.2);"><div class="num" style="color:var(--kitchen);">${totalPlayed?Math.round((totalWins/totalPlayed)*100):0}%</div><div class="lbl" style="color:#B9CFCB;">Win rate</div></div>
        <div class="stat-tile" style="background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.2);"><div class="num" style="color:var(--ball);">${totalDiff>0?"+":""}${totalDiff}</div><div class="lbl" style="color:#B9CFCB;">Point diff</div></div>
      </div>
      ${hist.map(h=>`
        <div class="history-row" style="border-bottom-color:rgba(255,255,255,0.14); margin-top:14px;">
          <div>
            <div class="loc" style="color:#fff;">${h.eventName}</div>
            <div class="help" style="color:#B9CFCB; margin-top:2px;">${h.teamName} (with ${h.partner}) &middot; ${h.stageReached}</div>
          </div>
          <div style="text-align:right;">
            <div style="color:var(--kitchen); font-weight:800;">${h.wins}-${h.losses} &middot; ${h.winPct}%</div>
            <div class="help" style="color:#B9CFCB;">${h.diff>0?"+":""}${h.diff} pts</div>
          </div>
        </div>`).join("")}
    </div>`;
}
function renderPassport(p){
  return `
    <div class="category-block" style="background:var(--ink); color:var(--kitchen); border-color:var(--ink);">
      <h3 style="color:var(--ball);">🛂 Pickleball Passport</h3>

function renderTierProgress(trackLabel, emoji, tiers, currentValue){
  const achievedTiers = tiers.filter(t=>currentValue>=t);
  const highestAchieved = achievedTiers.length ? achievedTiers[achievedTiers.length-1] : null;
  const nextTier = tiers.find(t=>currentValue<t) || null;
  if(highestAchieved===null){
    const target = tiers[0];
    const pct = Math.max(2, Math.min(100, (currentValue/target)*100));
    return `
      <div class="milestone-row">
        <div class="milestone-label">${emoji} ${target} ${trackLabel}</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;"></div></div>
        <div class="progress-text">${currentValue}/${target} \u2014 ${target-currentValue} to go</div>
      </div>`;
  }
  let html = `<div class="milestone-row"><div class="milestone-label earned">${emoji} ${highestAchieved} ${trackLabel} \u2713</div>`;
  if(nextTier){
    const pct = Math.max(2, Math.min(100, (currentValue/nextTier)*100));
    html += `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%;"></div></div><div class="progress-text">${currentValue}/${nextTier} \u2014 ${nextTier-currentValue} to go</div>`;
  } else {
    html += `<div class="progress-text">Top tier reached \ud83c\udf89</div>`;
  }
  html += `</div>`;
  return html;
}

function renderTypickleCourtQueue(){
  const ev = state.typickleEvent;
  if(!ev) return `<button class="back-link" data-action="go-home">&larr; Back</button><div class="card"><h2>No event loaded</h2></div>`;
  if(!state.typickleCourtNum){
    return `

      <div class="card">
        <p class="eyebrow">${ev.name}</p>

          <button class="btn btn-ink" data-action="typickle-set-court">View Queue</button>
        </div>
      </div>`;
  }
  const courtNum = state.typickleCourtNum;
  const teamName = id => (ev.teams.find(t=>t.id===id)||{}).name || "?";
  const allMatches = [
    ...ev.groups.flatMap(g=>g.matches),
    ...(ev.bracket ? ev.bracket.flat() : []),
    ...(ev.thirdPlaceMatch ? [ev.thirdPlaceMatch] : [])
  ];
  const playable = m => m.a && m.b && !m.a.bye && !m.b.bye;
  const live = allMatches.find(m=>m.court===courtNum && m.status==="live");
  const queued = allMatches.filter(m=> playable(m) && m.status==="scheduled" && (m.court===courtNum || m.court==null));

      <p class="eyebrow">Currently live</p>

        <div class="match-card">
          <div class="side">${teamName(live.a.id)}</div>

          <button class="btn btn-outline btn-sm" data-action="typickle-resume-match" data-code="${live.matchCode}">Resume</button>
        </div>` : `<p class="help">Nothing live on this court right now.</p>`}
    </div>
    <div class="card">
      <p class="eyebrow">Up next (${queued.length})</p>
      ${queued.length ? queued.slice(0,5).map(m=>`
        <div class="match-card">
          <div class="side">${teamName(m.a.id)}</div>
          <div class="side" style="text-align:center; flex:0; min-width:60px; font-weight:800;">&mdash;</div>
          <div class="side" style="text-align:right;">${teamName(m.b.id)}</div>
          <button class="btn btn-ink btn-sm" data-action="typickle-claim-match" data-match="${m.id}" data-court="${courtNum}">Score this match</button>
        </div>`).join("") : `<p class="help">No matches waiting for this court yet.</p>`}
    </div>`;
}

function renderLeaderboard(){
  if(state.loading) return `<div class="empty">Loading leaderboard…</div>`;
  const scope = state.leaderboardScope || "all";
  const rows = (scope==="month" ? state.leaderboardRowsMonth : state.leaderboardRowsAll) || [];
  const toggle = `
    <div class="chip-group" style="margin-bottom:14px;">
      <div class="chip ${scope==="all"?"active":""}" data-action="set-leaderboard-scope" data-scope="all">All-time</div>
      <div class="chip ${scope==="month"?"active":""}" data-action="set-leaderboard-scope" data-scope="month">This month</div>
    </div>`;
  if(!rows.length) return `<button class="back-link" data-action="go-home">&larr; Back</button><div class="card">${toggle}<h2>No results yet</h2><p class="sub">${scope==="month"?"No games logged this month so far.":"Play a session and come back"} &mdash; the leaderboard fills in as scores get logged.</p></div>`;
  const s = state.leaderboardSort;
  const val = r => r[s.key]==null ? -1 : r[s.key];
  const sorted = rows.slice().sort((a,b)=> s.dir==="desc" ? val(b)-val(a) : val(a)-val(b));
  const cols = [
    {key:"sessions", label:"Sessions"}, {key:"games", label:"Games"}, {key:"wins", label:"Wins"},
    {key:"losses", label:"Losses"}, {key:"winRate", label:"Win %"}, {key:"netPts", label:"Net Pts"},
    {key:"avgRating", label:"Rating"}
  ];
  const arrow = k => s.key===k ? (s.dir==="desc" ? " ↓" : " ↑") : "";
  return `
    <button class="back-link" data-action="go-home">&larr; Back</button>
    <div class="card">
      <h2>Leaderboard</h2>
      <p class="sub">Tap a column to sort. Tap a name for their full profile.</p>
      ${toggle}
      <div class="table-scroll"><table>
        <tr>
          <th>Player</th>
          ${cols.map(c=>`<th style="cursor:pointer;" data-action="sort-leaderboard" data-key="${c.key}">${c.label}${arrow(c.key)}</th>`).join("")}
        </tr>
        ${sorted.map(r=>`

            <td>${r.sessions}</td><td>${r.games}</td><td>${r.wins}</td><td>${r.losses}</td>
            <td>${Math.round(r.winRate*100)}%</td><td>${r.netPts>0?"+":""}${r.netPts.toFixed(1)}</td><td>${r.avgRating!=null?r.avgRating.toFixed(1):"—"}</td>
          </tr>`).join("")}
      </table></div>
    </div>
  `;
}

function renderPredictionReportBody(r){
  if(!r) return `<p class="help" style="margin-top:10px;">No predicted-and-completed matches found yet anywhere in the system.</p>`;
  const confRows = ["High","Medium","Low"].map(c=>{
    const d = r.byConfidence[c];
    return d.total ? `<tr><td>${c}</td><td>${d.correct}/${d.total}</td><td>${Math.round((d.correct/d.total)*100)}%</td></tr>` : "";
  }).join("");
  const signalRows = Object.keys(r.bySignals).sort((a,b)=>b-a).map(k=>{
    const d = r.bySignals[k];
    return `<tr><td>${k} signal${k==="1"?"":"s"} available</td><td>${d.correct}/${d.total}</td><td>${Math.round((d.correct/d.total)*100)}%</td></tr>`;
  }).join("");
  return `
    <div style="margin-top:14px;">
      <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);">
        <div class="stat-tile"><div class="num">${Math.round(r.accuracy*100)}%</div><div class="lbl">Overall accuracy</div></div>
        <div class="stat-tile"><div class="num">${r.total}</div><div class="lbl">Predictions checked</div></div>
        <div class="stat-tile"><div class="num">&plusmn;${r.avgMarginError.toFixed(1)}</div><div class="lbl">Avg scoreline error</div></div>
      </div>
      <p class="help">Brier score: ${r.brierScore.toFixed(3)} (0 = perfect, 0.25 = no better than a coin flip, 1 = always confidently wrong)</p>
      <p class="eyebrow" style="margin-top:14px;">Accuracy by confidence tier</p>
      <p class="help" style="margin-top:0;">If the algorithm's confidence is meaningful, High should consistently beat Low here.</p>
      <div class="table-scroll"><table><tr><th>Confidence</th><th>Correct</th><th>Accuracy</th></tr>${confRows}</table></div>
      <p class="eyebrow" style="margin-top:14px;">Accuracy by signals available</p>
      <p class="help" style="margin-top:0;">Whether having more data (Kitchen Rating, DUPR, fairness, head-to-head all present) actually predicts better.</p>
      <div class="table-scroll"><table><tr><th>Signals</th><th>Correct</th><th>Accuracy</th></tr>${signalRows}</table></div>
    </div>`;
}

function renderCrossoverSection(t, standings){
  if(standings.length<4) return "";
  if(t.crossoverFinal){
    return `<div class="round-label">Bonus: Crossover Final</div>${renderMatchCard(t.crossoverFinal, t, "cx")}`;

  const top4 = standings.slice(0,4);
  return `
    <div class="round-label">Bonus round</div>
    <div class="empty">
      Optional crossover final: <b>${top4[0].label} &amp; ${top4[3].label}</b> (#1 &amp; #4) vs <b>${top4[1].label} &amp; ${top4[2].label}</b> (#2 &amp; #3).
      <br><button class="btn btn-ink btn-sm" style="margin-top:10px;" data-action="add-crossover-final">Add crossover final</button>
    </div>`;
}
function formatLabel(t){
  if(t.format==="freeplay") return t.freeplayMode==="singles" ? "Freeplay" : "Freeplay Doubles";
  if(t.format==="groups") return "Groups + Knockout";
  if(t.format==="mixer") return "Rotating Partners";
  if(t.format==="roundrobin" && t.participants && t.participants.length===2) return "Match Series";
  return "Round Robin";
}
function bracketRoundName(idx, total){
  const remaining = total - idx;
  if(remaining===1) return "Final";
  if(remaining===2) return "Semifinal";
  if(remaining===3) return "Quarterfinal";
  return "Round "+(idx+1);
}
function allMatchesDone(matches){
  return matches.every(m=>m.isBye || (m.scoreA!=null && m.scoreB!=null));
}
function nameLinks(label){
  return label.split(" & ").map(n=>`<span class="player-link" data-action="view-profile" data-name="${n}">${n}</span>`).join(" &amp; ");
}
function renderStandingsTable(standings, advanceCount){
  if(!standings.length) return "";
  const diffMap = state.matchupDifficulty;
  return `
    <div class="table-scroll"><table>
      <tr><th>#</th><th>Player</th><th>W-L</th><th>Win%</th><th>+/-</th><th>Pts</th>${diffMap ? "<th>Expected Win%</th><th>Difficulty</th>" : ""}</tr>
      ${standings.map((s,i)=>{
        const played = s.won+s.lost;
        const winPct = played ? Math.round((s.won/played)*100) : 0;
        const d = diffMap ? diffMap[s.id] : null;
        return `
        <tr class="${advanceCount && i<advanceCount ? "leader":""}">
          <td>${i+1}</td><td>${nameLinks(s.label)}</td><td>${s.won}-${s.lost}</td><td>${winPct}%</td><td>${s.pf-s.pa>0?"+":""}${s.pf-s.pa}</td><td>${s.pts}</td>
          ${diffMap ? `<td>${d && d.expectedWinRate!=null ? Math.round(d.expectedWinRate*100)+"% ("+d.expectedWins+"-"+d.expectedLosses+")" : "&mdash;"}</td><td>${d && d.difficulty!=null ? d.difficulty.toFixed(1) : "&mdash;"}</td>` : ""}
        </tr>`;
      }).join("")}
    </table></div>`;
}
function renderMatchList(matches, t, ctx, editable){
  if(editable===undefined) editable = true;
  const rounds = {};
  matches.forEach(m=>{ (rounds[m.round]=rounds[m.round]||[]).push(m); });
  return Object.keys(rounds).sort((a,b)=>a-b).map(r=>`
    <div class="round-label">${ctx==="ko" ? "" : "Round "+r}</div>
    ${rounds[r].map(m=>renderMatchCard(m, t, ctx, editable)).join("")}
  `).join("");
}
function renderMatchCard(m, t, ctx, editable){
  if(editable===undefined) editable = true;
  const removable = editable && ctx!=="ko";
  const effectiveCtx = ctx||"rr";
  if(m.isBye){
    const real = m.a.bye ? m.b : m.a;
    return `<div class="match-card bye"><div class="side">${real.label}</div><div class="side">— Bye —</div></div>`;
  }
  if(!m.a || !m.b){
    return `<div class="match-card bye"><div class="side">TBD</div><div class="side">TBD</div></div>`;
  }
  const done = m.scoreA!=null && m.scoreB!=null;
  const scoreEditable = editable || !!state.adminUser;
  const editablePlayers = editable && (effectiveCtx==="mx" || effectiveCtx==="rr");
  if(editablePlayers && state.editingMatchId===m.id){
    return renderMatchEditForm(m, t, effectiveCtx);
  }
  const aWin = done && m.winner===m.a.id, bWin = done && m.winner===m.b.id;
  const courtTag = m.court ? `<span class="court-tag">Court ${m.court}</span>` : "";
  const pred = (!done && state.matchPredictions) ? state.matchPredictions[m.id] : null;
  const predTag = pred ? `<div class="predict-tag">${pred.favored==="A"?m.a.label:m.b.label} favored ${Math.round(Math.max(pred.probA,pred.probB)*100)}% \u00b7 Predicted ${pred.scoreline.winner}-${pred.scoreline.loser} \u00b7 ${pred.confidence} confidence</div>` : (done && m.prediction ? renderPredictionResult(m) : "");
  if(!scoreEditable){
    return `
      <div class="match-card ${done?"done":""}">
        ${courtTag}
        <div class="side ${aWin?"win":""}">${m.a.label}</div>
        <div class="side" style="text-align:center; flex:0; min-width:60px; font-weight:800;">${done?`${m.scoreA} – ${m.scoreB}`:"—"}</div>
        <div class="side ${bWin?"win":""}" style="text-align:right;">${m.b.label}</div>

async function addPlayerToSession(){
  const t = state.tournament;
  const nameEl = document.getElementById("addp-name");
  const duprEl = document.getElementById("addp-dupr");
  const name = nameEl.value.trim();
  if(!name){ showToast("Enter a player name"); return; }
  const already = t.participants.some(p=> p.label===name || (p.players && p.players.includes(name)));
  if(already){ showToast(`${name} is already in this session`); return; }
  const duprVal = duprEl.value.trim();
  const dupr = duprVal ? parseFloat(duprVal) : null;

  const priorParticipants = t.participants.slice();
  const newParticipant = {id:"p-add-"+Date.now(), label:name, dupr};
  t.participants.push(newParticipant);

  if(t.format==="roundrobin"){
    const maxRound = t.matches.length ? Math.max(...t.matches.map(m=>m.round)) : 0;
    let i=0;
    priorParticipants.forEach(p=>{
      if(p.bye) return;
      i++;
      t.matches.push({id:"add-"+Date.now()+"-"+i, round:maxRound+1, a:newParticipant, b:p, scoreA:null, scoreB:null, winner:null, isBye:false});
    });
  } else if(t.format==="mixer"){
    const fullList = t.participants.map(p=>({name:p.label, dupr:p.dupr}));
    const {opponentCounts, usedPartnerships, sitOutCounts} = buildTrackersFromMixerRounds(t.mixerRounds);
    let bestOrder=null, bestOverlap=Infinity;
    for(let attempt=0; attempt<8; attempt++){
      const candidate = shuffle(fullList);
      const overlap = previewPartnershipOverlap(candidate, fullList.length-1, usedPartnerships);
      if(overlap<bestOverlap){ bestOverlap=overlap; bestOrder=candidate; }
      if(bestOverlap===0) break;
    }
    const extra = generateMixerRounds(bestOrder, buildFairnessMap(), opponentCounts, usedPartnerships, sitOutCounts);
    const maxRound = t.mixerRounds.length ? Math.max(...t.mixerRounds.map(r=>r.round)) : 0;
    extra.forEach(r=>{ r.round += maxRound; r.matches.forEach(m=>{ m.round=r.round; m.id=m.id+"-add"+Date.now(); }); });
    assignCourts(extra, t.courts);
    t.mixerRounds = t.mixerRounds.concat(extra);
  }
  // freeplay: no auto-scheduling needed — they're simply now selectable in "Add a match"

  await saveTournament(t);
  await upsertPlayers([{name, dupr}]);
  await addToPlayerIndex(name, t.code);
  state.playerDb = await loadPlayerDb();
  state.kitchenRatings = null; state.expandedRating = null; state.matchPredictions = null; state.matchupDifficulty = null; state.matchupDifficultyIsForecast = false;
  render();
  showToast(`${name} added to the session`);
}
async function addManualMatch(){
  const t = state.tournament;
  const scoreAEl = document.getElementById("manual-scoreA"), scoreBEl = document.getElementById("manual-scoreB");
  const scoreA = scoreAEl.value===""? null : +scoreAEl.value;
  const scoreB = scoreBEl.value===""? null : +scoreBEl.value;
  if((scoreA!=null || scoreB!=null) && (scoreA==null || scoreB==null || scoreA===scoreB)){ showToast("Enter two different scores, or leave both blank"); return; }

  let aObj, bObj;
  if(t.format==="roundrobin"){
    const aId = document.getElementById("manual-a").value, bId = document.getElementById("manual-b").value;
    if(!aId || !bId || aId===bId){ showToast("Pick two different sides"); return; }
    aObj = t.participants.find(p=>p.id===aId);
    bObj = t.participants.find(p=>p.id===bId);
    if(!aObj || !bObj) return;
  } else {
    const a1=document.getElementById("manual-a1").value, a2=document.getElementById("manual-a2").value;
    const b1=document.getElementById("manual-b1").value, b2=document.getElementById("manual-b2").value;
    const names=[a1,a2,b1,b2];
    if(names.some(n=>!n)){ showToast("Pick all 4 players"); return; }
    if(new Set(names).size<4){ showToast("Each player can only appear once"); return; }
    aObj = {id:"man-a-"+Date.now(), label:a1+" & "+a2, players:[a1,a2]};
    bObj = {id:"man-b-"+Date.now()+"x", label:b1+" & "+b2, players:[b1,b2]};
  }

  const winner = (scoreA!=null && scoreB!=null) ? (scoreA>scoreB ? aObj.id : bObj.id) : null;
  const courtEl = document.getElementById("manual-court");
  const court = courtEl ? +courtEl.value : undefined;
  const match = {id:"man-"+Date.now(), round:0, a:aObj, b:bObj, scoreA, scoreB, winner, isBye:false};
  if(court) match.court = court;

  if(t.format==="roundrobin"){
    const maxRound = t.matches.length ? Math.max(...t.matches.map(m=>m.round)) : 0;
    match.round = maxRound+1;
    t.matches.push(match);
  } else {
    const maxRound = t.mixerRounds.length ? Math.max(...t.mixerRounds.map(r=>r.round)) : 0;
    match.round = maxRound+1;
    t.mixerRounds.push({round: match.round, matches:[match], sitOut:[]});
  }

  await saveTournament(t);
  state.kitchenRatings = null; state.expandedRating = null; state.matchPredictions = null; state.matchupDifficulty = null; state.matchupDifficultyIsForecast = false;
  render();
  showToast("Match added");
}

function computeCardSummary(t){
  let champion = null, standingsList = [], statusLabel = "Leaderboard";
  const crown = championEnabled(t);
  const ended = t.ended === true;
  const freeplayCrown = t.format==="freeplay" && crown;
  if(t.format==="mixer" || (t.format==="freeplay" && t.freeplayMode==="doubles")){
    const standings = computeMixerStandings(t.participants.map(p=>p.label), t.mixerRounds);
    const done = (t.format==="mixer" && t.mixerRounds.every(r=>r.matches.every(m=>m.scoreA!=null && m.scoreB!=null))) || ended;
    if(done && standings.length && crown){ champion = standings[0].label; statusLabel = "Champion"; }
    else if(freeplayCrown && standings.length){ champion = standings[0].label; statusLabel = "Leading"; }
    standingsList = standings.map(s=>({label:s.label, rec:`${s.won}-${s.lost}`}));
  } else if(t.format==="roundrobin" || (t.format==="freeplay" && t.freeplayMode==="singles")){
    const standings = computeStandings(t.participants, t.matches);
    const done = (t.format==="roundrobin" && allMatchesDone(t.matches)) || ended;
    if(done && standings.length && crown){ champion = standings[0].label; statusLabel = "Champion"; }
    else if(freeplayCrown && standings.length){ champion = standings[0].label; statusLabel = "Leading"; }
    standingsList = standings.map(s=>({label:s.label, rec:`${s.won}-${s.lost}`}));
  } else {
    if(t.bracket){
      const finalRound = t.bracket[t.bracket.length-1];
      if(finalRound && finalRound.length===1 && finalRound[0].winner && !finalRound[0].isBye && crown){
        const fm = finalRound[0];
        champion = (fm.a.id===fm.winner ? fm.a : fm.b).label;
        statusLabel = "Champion";
      } else if(ended){
        statusLabel = "Session ended";
      } else {
        statusLabel = "Knockout in progress";
      }
    } else if(ended){
      statusLabel = "Session ended";
    } else {
      statusLabel = "Group stage leaders";
    }
    standingsList = t.groups.map(g=>{
      const st = computeStandings(g.participants, g.matches);
      return st.length ? {label: `${g.name}: ${st[0].label}`, rec: `${st[0].won}-${st[0].lost}`} : null;
    }).filter(Boolean);
  }
  if(t.crossoverFinal && t.crossoverFinal.winner && crown){
    const cf = t.crossoverFinal;
    const w = cf.a.id===cf.winner ? cf.a : cf.b;
    if(!champion){ champion = w.label; statusLabel = "Crossover Final Winner"; }
  }
  return { champion, standingsList, statusLabel };
}

async function addMoreGames(){
  const t = state.tournament;
  if(t.format==="mixer"){
    const maxRound = t.mixerRounds.length ? Math.max(...t.mixerRounds.map(r=>r.round)) : 0;
    const playerList = t.participants.map(p=>({name:p.label, dupr:p.dupr}));
    const {opponentCounts, usedPartnerships, sitOutCounts} = buildTrackersFromMixerRounds(t.mixerRounds);
    let bestOrder=null, bestOverlap=Infinity;
    for(let attempt=0; attempt<8; attempt++){
      const candidate = shuffle(playerList);
      const overlap = previewPartnershipOverlap(candidate, playerList.length-1, usedPartnerships);
      if(overlap<bestOverlap){ bestOverlap=overlap; bestOrder=candidate; }
      if(bestOverlap===0) break;
    }
    const extra = generateMixerRounds(bestOrder, buildFairnessMap(), opponentCounts, usedPartnerships, sitOutCounts);
    extra.forEach(r=>{ r.round += maxRound; r.matches.forEach(m=>{ m.round=r.round; m.id=m.id+"-x"+maxRound; }); });
    assignCourts(extra, t.courts);
    t.mixerRounds = t.mixerRounds.concat(extra);
  } else if(t.format==="roundrobin"){
    const maxRound = t.matches.length ? Math.max(...t.matches.map(m=>m.round)) : 0;
    const extra = generateRoundRobin(t.participants);
    extra.forEach(m=>{ m.round+=maxRound; m.id=m.id+"-x"+maxRound; });
    assignCourtsToFlatMatches(extra, t.courts);
    t.matches = t.matches.concat(extra);
  } else if(t.format==="groups" && !t.bracket){
    t.groups.forEach(g=>{
      const maxRound = g.matches.length ? Math.max(...g.matches.map(m=>m.round)) : 0;
      const extra = generateRoundRobin(g.participants);
      extra.forEach(m=>{ m.round+=maxRound; m.id=m.id+"-x"+maxRound; });
      assignCourtsToFlatMatches(extra, t.courts);
      g.matches = g.matches.concat(extra);
    });
  } else {
    showToast("Can't add more league games once the knockout bracket has started");
    return;
  }
  await saveTournament(t);
  haptic("medium");
  render();
  showToast("Added another round of games");
}

async function openLocation(name){
  if(!name) return;
  stopPolling();
  state.loading = true; state.route = "location"; state.locationName = name; render();
  const codes = await getLocationIndex(name);
  let sessions=0, games=0; const recent=[];
  const playerTotals = {};
  for(const code of codes.slice(0,40)){
    const t = await loadTournamentByCode(code);
    if(!t) continue;
    const played = collectAllMatches(t).filter(m=>!m.isBye && m.scoreA!=null && m.scoreB!=null).length;
    sessions++; games+=played;
    recent.push({code:t.code, date:t.date, games:played, format:t.format});
    allTournamentPlayerNames(t).forEach(name2=>{
      const recs = extractPlayerMatchRecords(t, name2);
      if(!recs.length) return;
      if(!playerTotals[name2]) playerTotals[name2] = {name:name2, played:0, wins:0};
      playerTotals[name2].played += recs.length;
      playerTotals[name2].wins += recs.filter(r=>r.won).length;
    });
  }
  const playerList = Object.values(playerTotals);
  const mostActive = playerList.length ? playerList.slice().sort((a,b)=>b.played-a.played)[0] : null;
  const champEligible = playerList.filter(p=>p.played>=3);
  const courtChamp = (champEligible.length ? champEligible : playerList).length
    ? (champEligible.length?champEligible:playerList).slice().sort((a,b)=>(b.wins/b.played)-(a.wins/a.played))[0]
    : null;
  state.loading = false;
  state.locationStats = sessions ? {name, sessions, games, recent, mostActive, courtChamp} : null;
  render();
}

async function openLeaderboard(){
  stopPolling();
  state.loading = true; state.route = "leaderboard"; state.leaderboardScope = state.leaderboardScope || "all"; render();
  const cache = {};
  const ratingCache = {};
  const rowsAll = [], rowsMonth = [];
  const nowMonth = new Date().toISOString().slice(0,7);
  for(const dbP of state.playerDb){
    const codes = await getPlayerIndex(dbP.name);
    let all = {played:0,won:0,lost:0,pf:0,pa:0,tCount:0};
    let month = {played:0,won:0,lost:0,pf:0,pa:0,tCount:0};
    let allRatings = [], monthRatings = [];
    for(const code of codes){
      let t = cache[code];
      if(t===undefined){ t = await loadTournamentByCode(code); cache[code]=t; }
      if(!t) continue;
      const rec = extractPlayerRecord(t, dbP.name);
      if(rec.played===0) continue;
      all.played+=rec.played; all.won+=rec.won; all.lost+=rec.lost; all.pf+=rec.pf; all.pa+=rec.pa; all.tCount++;
      const isThisMonth = t.date && t.date.slice(0,7)===nowMonth;
      if(isThisMonth){
        month.played+=rec.played; month.won+=rec.won; month.lost+=rec.lost; month.pf+=rec.pf; month.pa+=rec.pa; month.tCount++;
      }
      const rating = await computeKitchenRating(t, dbP.name, ratingCache);
      if(rating){ allRatings.push(rating.overall); if(isThisMonth) monthRatings.push(rating.overall); }
    }
    if(all.played) rowsAll.push(leaderboardRow(dbP.name, all, allRatings));
    if(month.played) rowsMonth.push(leaderboardRow(dbP.name, month, monthRatings));
  }
  state.loading = false;
  state.leaderboardRowsAll = rowsAll;
  state.leaderboardRowsMonth = rowsMonth;
  render();
}

async function buildPredictionAccuracyReport(){
  const { data, error } = await sbClient.from("kv_store").select("key,value").like("key","tourney-%").limit(300);
  if(error) throw error;
  const tournaments = (data||[]).map(row=>{ try{ return JSON.parse(row.value); }catch(e){ return null; } }).filter(Boolean);
  let matches = [];
  tournaments.forEach(t=>{
    collectAllMatches(t).filter(m=>m.prediction && m.scoreA!=null && m.scoreB!=null && !m.isBye).forEach(m=>matches.push(m));
  });
  if(!matches.length) return null;
  let correct=0, marginErrorSum=0, brierSum=0;
  const byConfidence = {Low:{correct:0,total:0}, Medium:{correct:0,total:0}, High:{correct:0,total:0}};
  const bySignals = {};
  matches.forEach(m=>{
    const p = m.prediction;
    const isCorrect = (p.favored==="A" && m.winner===m.a.id) || (p.favored==="B" && m.winner===m.b.id);
    if(isCorrect) correct++;
    const predictedMargin = p.scoreline.winner - p.scoreline.loser;
    const actualMargin = Math.abs(m.scoreA-m.scoreB);
    marginErrorSum += Math.abs(predictedMargin-actualMargin);
    if(byConfidence[p.confidence]){ byConfidence[p.confidence].total++; if(isCorrect) byConfidence[p.confidence].correct++; }
    const sk = p.signalsUsed;
    if(!bySignals[sk]) bySignals[sk] = {correct:0,total:0};
    bySignals[sk].total++; if(isCorrect) bySignals[sk].correct++;
    const probActualWinner = isCorrect ? p.probFavored : (1-p.probFavored);
    brierSum += Math.pow(1-probActualWinner, 2);
  });
  return {
    total: matches.length, correct,
    accuracy: correct/matches.length,
    avgMarginError: marginErrorSum/matches.length,
    brierScore: brierSum/matches.length,
    byConfidence, bySignals
  };
}

      ].filter(Boolean);

async function buildTypicklePlayerHistory(name){
  let data;
  try{
    const res = await sbClient.from("kv_store").select("key,value").like("key", TYPICKLE_EVENT_PREFIX+"%").limit(200);
    data = res.data;
    if(res.error) return [];
  }catch(e){ return []; }
  const events = (data||[]).map(row=>{ try{ return JSON.parse(row.value); }catch(e){ return null; } }).filter(Boolean);
  const history = [];
  events.forEach(ev=>{
    const team = ev.teams.find(t=>t.players.includes(name));
    if(!team) return;
    const allMatches = [
      ...ev.groups.flatMap(g=>g.matches),
      ...(ev.bracket ? ev.bracket.flat() : []),
      ...(ev.thirdPlaceMatch ? [ev.thirdPlaceMatch] : [])
    ].filter(m=>m.status==="complete" && !m.isBye && m.a && m.b && (m.a.id===team.id || m.b.id===team.id));
    if(!allMatches.length) return;
    let wins=0, losses=0, pf=0, pa=0;
    allMatches.forEach(m=>{
      const isA = m.a.id===team.id;
      pf += isA ? m.pointsForA : m.pointsForB;
      pa += isA ? m.pointsForB : m.pointsForA;
      if(m.winner===team.id) wins++; else losses++;
    });
    let stageReached = "Group Stage";
    if(ev.bracket){
      const finalMatch = ev.bracket[ev.bracket.length-1][0];
      if(ev.status==="complete" && finalMatch.winner===team.id) stageReached = "\ud83c\udfc6 Champion";
      else if(finalMatch.a && finalMatch.b && (finalMatch.a.id===team.id || finalMatch.b.id===team.id)) stageReached = "Runner-up";
      else {
        const semis = ev.bracket.length>=2 ? ev.bracket[ev.bracket.length-2] : [];
        if(semis.some(m=>m.a && m.b && (m.a.id===team.id||m.b.id===team.id))) stageReached = "Semifinalist";
        else if(ev.bracket.some(round=>round.some(m=>m.a && m.b && (m.a.id===team.id||m.b.id===team.id)))) stageReached = "Knockout Stage";
      }
    }
    history.push({
      eventName: ev.name, eventCode: ev.code, teamName: team.name,
      partner: team.players.find(p=>p!==name),
      played: allMatches.length, wins, losses,
      winPct: Math.round((wins/allMatches.length)*100),
      pointsFor: pf, pointsAgainst: pa, diff: pf-pa,
      stageReached
    });
  });
  return history;
}

async function computeHeadToHead(nameA, nameB){
  const codes = await getPlayerIndex(nameA);
  let matchups = [];
  for(const code of codes.slice(0,40)){
    const t = await loadTournamentByCode(code);
    if(!t) continue;
    const recs = extractPlayerMatchRecords(t, nameA);
    recs.filter(r=>r.opponents.includes(nameB)).forEach(r=> matchups.push({...r, code:t.code, location:t.location}));
  }
  matchups.sort((a,b)=> a.date===b.date ? a.seq-b.seq : (a.date<b.date?-1:1));
  const winsA = matchups.filter(r=>r.won).length;
  const winsB = matchups.length - winsA;
  const avgMargin = matchups.length ? matchups.reduce((s,r)=>s+(r.scoreFor-r.scoreAgainst),0)/matchups.length : 0;
  const last5 = matchups.slice(-5).reverse();
  return { nameA, nameB, total: matchups.length, winsA, winsB, avgMargin, last5 };
}

  const paired = new Set(f.teams.flat());
  let pool = f.players.filter(p=>!paired.has(p.name));
  if(balanced && pool.some(p=>p.dupr)){
    pool = pool.slice().sort((a,b)=>(b.dupr||0)-(a.dupr||0));
    while(pool.length>=2){ const hi=pool.shift(); const lo=pool.pop(); f.teams.push([hi.name, lo.name]); }

  }
  render();
}

async function buildTournament(){
  pullFormInputs();
  const f = state.form;
  const loc = f.location==="Other" ? (f.otherLocation.trim()||"Other") : f.location;
  if(!loc){ showToast("Pick a location"); return; }
  if(f.matchType==="doubles"){
    if(f.players.length<4 || f.players.length%2!==0){ showToast("Need an even number of players (min 4) for doubles"); return; }
    if(f.format!=="freeplay"){
      const paired = new Set(f.teams.flat());
      if(f.players.some(p=>!paired.has(p.name))){ showToast("Pair up every player before continuing"); return; }
    }
  } else if(f.matchType==="mixer"){
    if(f.players.length<4){ showToast("Add at least 4 players for rotating-partner doubles"); return; }
  } else {
    if(f.players.length<2){ showToast("Add at least 2 players"); return; }
  }

  state.loading = true; render();

  let participants;
  if(f.matchType==="doubles" && f.format!=="freeplay"){
    participants = f.teams.map((t,i)=>{
      const p1 = f.players.find(p=>p.name===t[0]);
      const p2 = f.players.find(p=>p.name===t[1]);
      const dupr = (p1.dupr && p2.dupr) ? +(((p1.dupr+p2.dupr)/2).toFixed(2)) : null;
      return {id:"team-"+i, label:t[0]+" & "+t[1], players:[t[0],t[1]], dupr};
    });
  } else {
    participants = f.players.map((p,i)=>({id:"p-"+i, label:p.name, dupr:p.dupr}));
  }

  const code = await generateUniqueCode();
  const effectiveFormat = f.matchType==="mixer" ? "mixer" : f.format;
  let tournament = {
    code, location: loc, date: f.date, duration: f.duration, gameLen: f.gameLen, courts: f.courts,
    matchType: f.matchType, format: effectiveFormat, advancePerGroup: f.advancePerGroup, crownChampion: f.crownChampion,
    participants, createdAt: Date.now()
  };

  const targetGames = recommendedMaxMatches(f.duration, f.gameLen, f.courts);

  if(effectiveFormat==="mixer"){
    tournament.mixerRounds = fillMixerToTarget(f.players, targetGames, buildFairnessMap());
    assignCourts(tournament.mixerRounds, f.courts);
  } else if(effectiveFormat==="roundrobin"){
    tournament.matches = fillRoundRobinToTarget(participants, targetGames);
    assignCourtsToFlatMatches(tournament.matches, f.courts);
  } else if(effectiveFormat==="freeplay"){
    tournament.freeplayMode = f.matchType==="singles" ? "singles" : "doubles";
    if(tournament.freeplayMode==="singles"){
      tournament.matches = [];
    } else {
      tournament.mixerRounds = [{round:1, matches:[], sitOut:[]}];
    }
  } else {
    tournament.groups = makeGroups(participants, f.groupSize);
    const perGroupTarget = Math.max(1, Math.round(targetGames / tournament.groups.length));
    tournament.groups.forEach(g=>{ g.matches = fillRoundRobinToTarget(g.participants, perGroupTarget); assignCourtsToFlatMatches(g.matches, f.courts); });
    tournament.bracket = null;
  }

  await saveTournament(tournament);
  await upsertPlayers(f.players);
  await Promise.all(f.players.map(p=>addToPlayerIndex(p.name, code)));
  await addToLocationIndex(loc, code);

  state.loading = false;
  state.tournament = tournament;
  haptic("medium");
  nav("confirm");
}

async function startKnockout(){
  const t = state.tournament;
  const adv = t.advancePerGroup;
  let qualifiers = [];
  t.groups.forEach(g=>{
    const st = computeStandings(g.participants, g.matches);
    st.slice(0, adv).forEach(s=>{
      const full = g.participants.find(p=>p.id===s.id);
      qualifiers.push(full);
    });
  });
  qualifiers = shuffle(qualifiers); // light shuffle so same-group pairs aren't guaranteed to meet immediately after seeding order
  t.bracket = makeBracket(qualifiers);
  assignCourts(t.bracket, t.courts);
  await saveTournament(t);
  haptic("medium");
  render();
}

async function handleRemoveMatch(mid, ctx){
  const t = state.tournament;
  const m = findMatch(t, mid, ctx);
  if(!m) return;
  const hasScore = m.scoreA!=null && m.scoreB!=null;
  if(hasScore){
    if(!confirm("This match already has a score — remove it and its result permanently?")) return;
  }
  if(ctx==="cx"){
    t.crossoverFinal = null;
  } else if(ctx==="grp"){
    for(const g of t.groups){ const idx=g.matches.findIndex(x=>x.id===mid); if(idx>=0){ g.matches.splice(idx,1); break; } }
  } else if(ctx==="mx"){
    for(const r of t.mixerRounds){ const idx=r.matches.findIndex(x=>x.id===mid); if(idx>=0){ r.matches.splice(idx,1); break; } }
  } else {
    const idx = t.matches.findIndex(x=>x.id===mid);
    if(idx>=0) t.matches.splice(idx,1);
  }
  await saveTournament(t);
  haptic("strong");
  state.kitchenRatings = null; state.expandedRating = null; state.matchPredictions = null; state.matchupDifficulty = null; state.matchupDifficultyIsForecast = false;
  render();
  showToast("Match removed");
}
async function saveEditMatch(mid, ctx){

    match.b = {id:match.b.id, label:b1+" & "+b2, players:[b1,b2]};
  } else {
    const paId = document.getElementById("edit-pa").value, pbId = document.getElementById("edit-pb").value;
    if(!paId || !pbId || paId===pbId){ showToast("Pick two different sides"); return; }
    const pa = t.participants.find(p=>p.id===paId), pb = t.participants.find(p=>p.id===pbId);
    if(!pa || !pb) return;
    match.a = pa; match.b = pb;
  }

  delete match.prediction;
  await saveTournament(t);
  state.editingMatchId = null;
  state.kitchenRatings = null; state.expandedRating = null; state.matchPredictions = null; state.matchupDifficulty = null; state.matchupDifficultyIsForecast = false;
  render();
  showToast("Match updated");
}
async function endSession(){
  if(!confirm("End this session? This locks the bracket, finalizes standings, and stops any further score edits or new matches. You can't undo this.")) return;
  if(!confirm("Just to be sure — end the session now?")) return;
  const t = state.tournament;
  t.ended = true;
  t.endedAt = Date.now();
  await saveTournament(t);
  haptic("strong");
  render();
  showToast("Session ended");
}
function findMatch(t, mid, ctx){
  if(ctx==="cx") return t.crossoverFinal && t.crossoverFinal.id===mid ? t.crossoverFinal : null;
  if(ctx==="ko") { for(const round of t.bracket) { const m=round.find(x=>x.id===mid); if(m) return m; } return null; }
  if(ctx==="grp") { for(const g of t.groups) { const m=g.matches.find(x=>x.id===mid); if(m) return m; } return null; }
  if(ctx==="mx") { for(const r of t.mixerRounds) { const m=r.matches.find(x=>x.id===mid); if(m) return m; } return null; }
  return t.matches.find(x=>x.id===mid);
}

function copyText(text, msg){
  haptic("light");
  navigator.clipboard?.writeText(text).then(()=>showToast(msg)).catch(()=>showToast(text));
}

/* ============================= LIVE POLLING ============================= */
function startPolling(){
  stopPolling();
  state.pollHandle = setInterval(async ()=>{
    if(state.route!=="view" || !state.tCode) return;
    const fresh = await loadTournamentByCode(state.tCode);
    if(fresh && (!state.tournament || fresh.updatedAt !== state.tournament.updatedAt)){
      state.tournament = fresh;
      render();
    }
  }, 4000);
}

/* ============================= INIT ============================= */
async function init(){
  state.playerDb = await loadPlayerDb();
  await checkAdminSession();
  try{ if(localStorage.getItem("typickle-referee-authed")==="true") state.refereeAuthed = true; }catch(e){}
  const hash = location.hash;
  if(hash.startsWith("#code=")){
    const code = hash.replace("#code=","").toUpperCase();
    state.loading = true; state.route="view"; render();
    const t = await loadTournamentByCode(code);
    state.loading=false; state.tournament=t; state.tCode=code; state.kitchenRatings=null; state.expandedRating=null; state.editingMatchId=null; state.matchPredictions=null; state.matchupDifficulty=null; state.matchupDifficultyIsForecast=false;
    render();
    if(t) startPolling();
  } else {
    let resumeCode = null;
    try{
      if(state.refereeAuthed) resumeCode = localStorage.getItem("typickle-current-match");
    }catch(e){}
    if(resumeCode){
      await openLiveScoring();
    } else {
      render();
    }
  }
}
init();
</script>
