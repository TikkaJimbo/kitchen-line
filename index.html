<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen Line — Sri Lanka Pickleball</title>
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Kitchen Line">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0E5C55">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --ink:#0B2B29;
    --court:#0E5C55;
    --court-dark:#0A413C;
    --kitchen:#F2EFE4;
    --paper:#FBF8F0;
    --ball:#D7E639;
    --ball-dark:#B9C920;
    --line:#E4DFCB;
    --red:#C1502E;
    --muted:#5B7A76;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    min-height:100vh;
  }
  .display{font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:0.02em; text-transform:uppercase;}
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{max-width:900px; margin:0 auto; padding:0 16px 80px;}

  /* ---- top bar ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 4px 14px;
  }
  .brand{display:flex; align-items:center; gap:10px; cursor:pointer; min-width:0;}
  .brand .dot{width:14px; height:14px; border-radius:50%; background:var(--ball); border:2px solid var(--ink); flex:0 0 auto;}
  .brand span{font-family:'Oswald',sans-serif; font-weight:600; font-size:22px; letter-spacing:0.03em; text-transform:uppercase;}
  .brand > div{min-width:0;}
  .brand small{display:block; font-size:10.5px; letter-spacing:0.01em; color:var(--muted); font-weight:600; text-transform:none; margin-top:1px; line-height:1.3;}
  .topbar-right{display:flex; align-items:center; gap:14px;}
  .powered-by{display:flex; flex-direction:column; align-items:flex-end; gap:3px;}
  .powered-by-label{font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); font-weight:700;}
  .powered-by-logo{height:38px; width:auto; display:block; object-fit:contain;}
  @media(max-width:520px){
    .powered-by-logo{height:30px;}
    .powered-by-label{font-size:8.5px;}
  }

  /* ---- court line divider ---- */
  .court-rule{
    height:10px; margin:18px 0 26px;
    background-image: repeating-linear-gradient(90deg, var(--court) 0 22px, transparent 22px 34px);
    background-position: center;
    background-repeat:no-repeat;
    background-size: 100% 3px;
    position:relative;
  }
  .court-rule::before, .court-rule::after{
    content:""; position:absolute; top:0; width:3px; height:10px; background:var(--court);
  }
  .court-rule::before{left:0;} .court-rule::after{right:0;}

  /* ---- hero ---- */
  .hero{
    background:var(--court);
    background-image: radial-gradient(circle at 85% -10%, rgba(215,230,57,0.18), transparent 45%);
    border-radius:22px;
    padding:38px 30px 32px;
    color:var(--kitchen);
    position:relative;
    overflow:hidden;
  }
  .hero .court-svg{position:absolute; right:-40px; bottom:-40px; opacity:0.16; width:220px;}
  .hero h1{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:44px; line-height:0.98; margin:0 0 12px; text-transform:uppercase;
    max-width:520px;
  }
  .hero h1 em{font-style:normal; color:var(--ball);}
  .hero p{max-width:480px; font-size:15px; line-height:1.55; color:#DCEDEA; margin:0 0 26px;}
  .hero-actions{display:flex; gap:12px; flex-wrap:wrap;}

  /* ---- buttons ---- */
  .btn{
    font-family:'Manrope',sans-serif; font-weight:800; font-size:14px;
    padding:13px 22px; border-radius:12px; border:2px solid var(--ink); cursor:pointer;
    display:inline-flex; align-items:center; gap:8px; transition:transform .12s ease;
    text-transform:uppercase; letter-spacing:0.03em;
  }
  .btn:active{transform:scale(0.97);}
  .btn-ball{background:var(--ball); color:var(--ink);}
  .btn-ghost{background:transparent; color:var(--kitchen); border-color:rgba(255,255,255,0.5);}
  .btn-ink{background:var(--ink); color:var(--kitchen); border-color:var(--ink);}
  .btn-outline{background:transparent; color:var(--ink); border-color:var(--ink);}
  .btn-sm{padding:9px 14px; font-size:12px; border-radius:9px;}
  .btn[disabled]{opacity:0.4; cursor:not-allowed;}
  .btn-wide{width:100%; justify-content:center;}

  /* ---- cards / sections ---- */
  .card{
    background:var(--kitchen); border:2px solid var(--ink); border-radius:18px;
    padding:24px; margin-bottom:20px;
  }
  .card h2{font-family:'Oswald',sans-serif; font-weight:600; font-size:22px; text-transform:uppercase; margin:0 0 4px;}
  .card .sub{color:var(--muted); font-size:13px; margin:0 0 18px; font-weight:600;}
  .eyebrow{font-size:11px; font-weight:800; letter-spacing:0.14em; text-transform:uppercase; color:var(--court); margin:0 0 6px;}

  label{display:block; font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:0.04em; margin:0 0 6px; color:var(--ink);}
  .field{margin-bottom:16px;}
  input[type=text], input[type=number], input[type=date], input[type=password], select, textarea{
    width:100%; padding:11px 13px; border-radius:10px; border:2px solid var(--line);
    background:#fff; font-family:'Manrope',sans-serif; font-size:14px; color:var(--ink);
  }
  input:focus, select:focus{outline:none; border-color:var(--court);}
  .row{display:flex; gap:14px; flex-wrap:wrap;}
  .row > .field{flex:1; min-width:150px;}
  .chip-group{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    padding:9px 15px; border-radius:999px; border:2px solid var(--ink); font-weight:700; font-size:13px;
    cursor:pointer; background:#fff; user-select:none;
  }
  .chip.active{background:var(--ink); color:var(--kitchen);}
  .help{font-size:12px; color:var(--muted); margin-top:6px; font-weight:600;}

  .player-add-row{display:flex; gap:8px; align-items:flex-end; margin-bottom:14px;}
  .player-add-row .field{margin-bottom:0; flex:1;}
  .player-add-row .field.dupr{max-width:110px; flex:none;}

  .player-list{display:flex; flex-direction:column; gap:8px;}
  .player-pill{
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border:2px solid var(--line); border-radius:12px; padding:10px 14px;
  }
  .player-pill .name{font-weight:800; font-size:14px;}
  .player-pill .dupr-tag{font-size:11px; color:var(--muted); font-weight:700; margin-left:8px;}
  .remove-btn{background:none; border:none; color:var(--red); font-weight:800; cursor:pointer; font-size:13px;}

  .pair-chip{padding:10px 14px; border-radius:10px; border:2px solid var(--ink); font-weight:700; cursor:pointer; background:#fff;}
  .pair-chip.selected{background:var(--ball);}
  .pair-chip.used{opacity:0.35; cursor:not-allowed;}
  .team-row{display:flex; align-items:center; justify-content:space-between; background:#fff; border:2px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:8px; font-weight:700;}

  /* ---- code display ---- */
  .code-box{
    background:var(--ink); border-radius:18px; padding:30px; text-align:center; color:var(--kitchen); margin-bottom:20px;
  }
  .code-box .lbl{font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--ball); font-weight:800; margin-bottom:10px;}
  .code-box .code{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:42px; letter-spacing:0.14em;}
  .code-box .sub{font-size:12.5px; color:#B9CFCB; margin-top:10px;}

  /* ---- join box ---- */
  .join-row{display:flex; gap:10px;}
  .join-row input{text-transform:uppercase; letter-spacing:0.08em; font-family:'JetBrains Mono',monospace; font-weight:700;}

  /* ---- tournament header ---- */
  .thead{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:14px; margin-bottom:18px;}
  .thead .meta{font-size:13px; color:var(--muted); font-weight:700; display:flex; gap:14px; flex-wrap:wrap; margin-top:6px;}
  .thead .code-pill{font-family:'JetBrains Mono',monospace; font-weight:700; background:var(--ball); border:2px solid var(--ink); border-radius:10px; padding:6px 12px; font-size:14px;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); padding:6px 8px; border-bottom:2px solid var(--ink);}
  td{padding:8px; border-bottom:1px solid var(--line); font-weight:600;}
  tr.leader td{background:rgba(215,230,57,0.35);}

  .group-block{border:2px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; background:#fff;}
  .group-block h3{font-family:'Oswald',sans-serif; font-weight:600; font-size:16px; margin:0 0 10px; text-transform:uppercase; color:var(--court);}

  .match-card{
    border:2px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; background:#fff;
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .match-card.done{border-color:var(--court); background:rgba(14,92,85,0.05);}
  .match-card.bye{opacity:0.5;}
  .court-tag{background:var(--ball); color:var(--ink); font-size:10px; font-weight:800; padding:3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:0.04em; flex:0 0 auto;}
  .predict-tag{flex:1 1 100%; font-size:11.5px; color:var(--court); font-weight:700;}
  .ls-score-display{text-align:center; margin-bottom:18px;}
  .ls-score-num{font-family:'Oswald',sans-serif; font-weight:600; font-size:52px; color:var(--ink); line-height:1;}
  .ls-serving-note{font-size:13px; color:var(--muted); font-weight:700; margin-top:6px;}
  .ls-serving-note b{color:var(--ink);}
  .ls-position-court{display:flex; border:2px solid var(--ink); border-radius:12px; overflow:hidden; margin-bottom:16px; aspect-ratio:44/20;}
  .ls-position-col{flex:1; display:flex; flex-direction:column;}
  .ls-quad{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:14px 8px; background:var(--paper); border-bottom:1px dashed var(--line); position:relative;}
  .ls-position-col .ls-quad:last-child{border-bottom:none;}
  .ls-quad.serving{background:rgba(215,230,57,0.3);}
  .ls-quad.filled{background:rgba(14,92,85,0.06);}
  .ls-quad.targetable{background:rgba(215,230,57,0.18); cursor:pointer;}
  .ls-quad-team{font-size:12.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--court); font-weight:800; opacity:1;}
  .ls-quad-court{font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--court); font-weight:700;}
  .ls-quad-occupant{font-weight:800; font-size:15px; margin-top:2px;}
  .ls-net{width:5px; background:repeating-linear-gradient(180deg, var(--ink) 0 8px, transparent 8px 14px); flex:0 0 auto;}
  .ls-buttons{display:flex; gap:10px; margin-bottom:12px;}
  .ls-point-btn{flex:1; padding:22px 10px; border-radius:14px; border:2px solid var(--ink); background:var(--court); color:#fff; font-family:'Oswald',sans-serif; font-weight:600; font-size:16px; line-height:1.5; text-transform:uppercase; cursor:pointer;}
  .ls-point-btn:active{transform:scale(0.97);}
  .ls-point-btn b{font-size:19px;}
  .ls-gameover{text-align:center; padding:16px 0 4px;}
  .ls-gameover h2{margin-bottom:16px; font-size:19px;}
  .side{font-weight:800; font-size:13.5px; flex:1; min-width:110px;}
  .side.win{color:var(--court);}
  .score-inputs{display:flex; align-items:center; gap:6px;}
  .score-inputs input{width:48px; padding:7px; text-align:center; font-weight:800;}
  .save-score{white-space:nowrap;}
  .round-label{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); margin:14px 0 8px;}

  .bracket-round{margin-bottom:10px;}
  .bracket-round .round-label{margin-top:20px;}

  .champion-banner{
    background:var(--ball); border:3px solid var(--ink); border-radius:16px; padding:20px; text-align:center; margin-bottom:20px;
  }
  .champion-banner .lbl{font-size:11px; font-weight:800; letter-spacing:0.14em; text-transform:uppercase;}
  .champion-banner .name{font-family:'Oswald',sans-serif; font-weight:600; font-size:30px; text-transform:uppercase; margin-top:4px;}

  .player-link{cursor:pointer; text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px;}
  .player-link:hover{color:var(--court);}
  .profile-head{display:flex; align-items:center; gap:14px; margin-bottom:6px;}
  .profile-avatar{width:52px; height:52px; border-radius:50%; background:var(--ball); border:2px solid var(--ink); display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:600; font-size:20px;}
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:16px 0;}
  .stat-grid.cols-6{grid-template-columns:repeat(6,1fr);}
  .stat-grid.cols-5{grid-template-columns:repeat(5,1fr);}
  .stat-grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .stat-tile{background:#fff; border:2px solid var(--line); border-radius:12px; padding:12px; text-align:center;}
  .stat-tile .num{font-family:'Oswald',sans-serif; font-weight:600; font-size:24px;}
  .stat-tile .lbl{font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); font-weight:700;}
  .history-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px; font-weight:600;}
  .history-row .loc{font-weight:800;}
  .history-row .rec{color:var(--court); font-weight:800;}
  .category-block{border:2px solid var(--ink); border-radius:16px; padding:20px; margin-bottom:20px; background:var(--kitchen);}
  .category-block h3{font-family:'Oswald',sans-serif; font-weight:600; font-size:20px; text-transform:uppercase; margin:0 0 4px;}
  .highlight-pair{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0;}
  .highlight-card{background:#fff; border:2px solid var(--line); border-radius:12px; padding:12px;}
  .highlight-card.best{border-color:var(--court);}
  .highlight-card.rival{border-color:var(--red);}
  .highlight-card .tag{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.05em;}
  .highlight-card.best .tag{color:var(--court);}
  .highlight-card.rival .tag{color:var(--red);}
  .highlight-card .who{font-family:'Oswald',sans-serif; font-weight:600; font-size:17px; margin:4px 0 2px;}
  .highlight-card .rec{font-size:12px; font-weight:700; color:var(--muted);}
  .streak-row{display:flex; gap:10px; flex-wrap:wrap; margin:10px 0 4px;}
  .streak-badge{background:#fff; border:2px solid var(--line); border-radius:999px; padding:6px 14px; font-size:12.5px; font-weight:800;}
  .streak-badge.hot{border-color:var(--ball-dark); background:rgba(215,230,57,0.3);}
  .streak-badge.cold{border-color:var(--red); background:rgba(193,80,46,0.08); color:var(--red);}
  .chart-block{margin-top:16px;}
  .chart-block h4{font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); font-weight:800; margin:0 0 8px;}
  .h2h-table td, .h2h-table th{font-size:12.5px;}
  .rating-row{border:2px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; background:#fff; cursor:pointer;}
  .rating-row-head{display:flex; justify-content:space-between; align-items:center;}
  .rating-name{font-weight:800; font-size:14px;}
  .rating-badge{font-family:'Oswald',sans-serif; font-weight:600; font-size:16px; display:flex; align-items:center; gap:8px;}
  .rating-label{font-family:'Manrope',sans-serif; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted);}
  .rating-detail{margin-top:10px; padding-top:10px; border-top:1px solid var(--line); display:grid; grid-template-columns:1fr 1fr; gap:6px 16px;}
  .rating-comp{display:flex; justify-content:space-between; font-size:12.5px; font-weight:700;}
  .rating-comp small{color:var(--muted); font-weight:600;}
  .result-card-wrap{position:fixed; left:-9999px; top:0;}
  .rc-card{width:640px; padding:44px; background:var(--court); background-image: radial-gradient(circle at 85% -10%, rgba(215,230,57,0.25), transparent 45%); color:var(--kitchen); font-family:'Manrope',sans-serif;}
  .rc-brand{display:flex; align-items:center; gap:8px; margin-bottom:28px;}
  .rc-brand .dot{width:12px; height:12px; border-radius:50%; background:var(--ball); border:2px solid var(--kitchen);}
  .rc-brand span{font-family:'Oswald',sans-serif; font-weight:600; font-size:18px; text-transform:uppercase; letter-spacing:0.03em;}
  .rc-loc{font-family:'Oswald',sans-serif; font-weight:600; font-size:34px; text-transform:uppercase; line-height:1.05; margin:0 0 6px;}
  .rc-meta{font-size:13px; color:#DCEDEA; font-weight:700; margin-bottom:22px;}
  .rc-champ-lbl{font-size:11px; font-weight:800; letter-spacing:0.16em; text-transform:uppercase; color:var(--ball); margin-bottom:6px;}
  .rc-champ-name{font-family:'Oswald',sans-serif; font-weight:600; font-size:40px; text-transform:uppercase; line-height:1.05; margin-bottom:24px;}
  .rc-rating{font-size:14px; font-weight:800; color:var(--ball); background:rgba(0,0,0,0.18); display:inline-block; padding:8px 14px; border-radius:10px; margin-bottom:20px;}
  .rc-standings{background:rgba(251,248,240,0.1); border-radius:14px; padding:16px 20px; margin-bottom:22px;}
  .rc-standings-row{display:flex; justify-content:space-between; padding:6px 0; font-size:14px; font-weight:700; border-bottom:1px solid rgba(255,255,255,0.14);}
  .rc-standings-row:last-child{border-bottom:none;}
  .rc-code{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:20px; letter-spacing:0.12em; background:rgba(0,0,0,0.2); display:inline-block; padding:8px 16px; border-radius:10px;}
  .rc-footer{font-size:11px; color:#B9CFCB; margin-top:10px; font-weight:600;}
  .empty{text-align:center; padding:30px 10px; color:var(--muted); font-weight:600; font-size:13.5px;}
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--kitchen); padding:12px 20px; border-radius:10px; font-weight:700; font-size:13px;
    z-index:50; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
  .back-link{background:none; border:none; color:var(--court); font-weight:800; font-size:13px; cursor:pointer; padding:0; margin-bottom:14px; display:inline-flex; align-items:center; gap:5px;}
  .footer-note{text-align:center; color:var(--muted); font-size:11.5px; margin-top:30px; line-height:1.6; font-weight:600;}
  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .milestone-row{margin-bottom:16px;}
  .milestone-row:last-child{margin-bottom:0;}
  .milestone-label{font-weight:800; font-size:14.5px; margin-bottom:4px;}
  .milestone-label.earned{color:var(--court);}
  .progress-bar{background:var(--line); border-radius:999px; height:8px; overflow:hidden; margin:4px 0 5px;}
  .progress-fill{background:var(--court); height:100%; border-radius:999px;}
  .progress-text{font-size:11.5px; color:var(--muted); font-weight:700;}
  @media(max-width:520px){
    body{font-size:15px;}
    #app{padding:0 12px 70px;}
    .hero{padding:28px 20px 24px;}
    .hero h1{font-size:28px;}
    .hero p{font-size:13.5px;}
    .card{padding:18px;}
    .code-box{padding:22px;}
    .code-box .code{font-size:30px; letter-spacing:0.06em;}
    .stat-grid{grid-template-columns:repeat(2,1fr) !important; gap:8px;}
    .stat-tile{padding:10px 8px;}
    .stat-tile .num{font-size:19px;}
    .highlight-pair{grid-template-columns:1fr;}
    table{font-size:12.5px;}
    th, td{padding:6px 5px;}
    .row{gap:10px;}
    .row > .field{min-width:130px;}
    .player-add-row{flex-wrap:wrap;}
    .player-add-row .field.dupr{max-width:none; flex:1 1 80px;}
    .match-card{padding:10px 12px; gap:8px;}
    .side{font-size:12.5px; min-width:72px;}
    .score-inputs input{width:38px; padding:6px;}
    .save-score{padding:9px 12px; font-size:11.5px;}
    .thead{gap:8px;}
    .thead h2.display{font-size:21px !important;}
    .code-pill{font-size:12px; padding:5px 10px;}
    .champion-banner .name{font-size:24px;}

function generateGroupMatches(teams, groupId){
  const participants = teams.map(t=>({id:t.id, label:t.name}));
  const raw = generateRoundRobin(participants);
  return raw.filter(m=>!m.isBye).map(m=>({

    matchCode:null, status:"scheduled", court:null,
    gamesWonA:null, gamesWonB:null, winner:null,
    pointsForA:null, pointsForB:null
  }));
}
function computeGroupStandings(group, teams){
  const table = {};
  group.teamIds.forEach(tid=>{
    const t = teams.find(x=>x.id===tid);
    table[tid] = { id:tid, name:t.name, played:0, won:0, lost:0, pf:0, pa:0 };
  });
  group.matches.forEach(m=>{
    if(m.status!=="complete") return;
    const rowA = table[m.a.id], rowB = table[m.b.id];
    if(!rowA || !rowB) return;
    rowA.played++; rowB.played++;
    rowA.pf += m.pointsForA; rowA.pa += m.pointsForB;
    rowB.pf += m.pointsForB; rowB.pa += m.pointsForA;
    if(m.winner===m.a.id){ rowA.won++; rowB.lost++; } else { rowB.won++; rowA.lost++; }
  });
  const rows = Object.values(table);
  rows.sort((x,y)=>{
    if(y.won!==x.won) return y.won-x.won;
    const diffX = x.pf-x.pa, diffY = y.pf-y.pa;
    if(diffY!==diffX) return diffY-diffX;
    // tiebreak: head-to-head between exactly these two teams
    const h2h = group.matches.find(m=>m.status==="complete" && ((m.a.id===x.id&&m.b.id===y.id)||(m.a.id===y.id&&m.b.id===x.id)));
    if(h2h) return h2h.winner===x.id ? -1 : 1;
    return 0;
  });
  return rows;
}
function makeTypickleGroups(teams, groupCount){

  const groups = Array.from({length:groupCount}, ()=>[]);
  let dir=1, g=0;
  sorted.forEach(t=>{
    groups[g].push(t);
    if(dir===1){ if(g===groupCount-1) dir=-1; else g++; }
    else { if(g===0) dir=1; else g--; }
  });
  return groups.map((gTeams,i)=>{
    const groupId = "G"+(i+1);
    return {
      id: groupId, label:"Group "+String.fromCharCode(65+i),
      teamIds: gTeams.map(t=>t.id),
      matches: generateGroupMatches(gTeams, groupId)
    };
  });
}

function collectAllMatches(t){
  let list;
  if(t.format==="mixer" || (t.format==="freeplay" && t.freeplayMode==="doubles")) list = t.mixerRounds.flatMap(r=>r.matches);
  else if(t.format==="groups") list = t.groups.flatMap(g=>g.matches).concat(t.bracket ? t.bracket.flat() : []);
  else list = t.matches || [];
  if(t.crossoverFinal) list = list.concat([t.crossoverFinal]);
  return list;
}
function matchInvolves(m, name){
  const has = p => p && (p.label===name || (p.players && p.players.includes(name)));
  return has(m.a) || has(m.b);
}
function extractPlayerRecord(t, name){
  const rec = {played:0, won:0, lost:0, pf:0, pa:0};
  collectAllMatches(t).forEach(m=>{
    if(m.isBye || m.scoreA==null || m.scoreB==null || !matchInvolves(m, name)) return;
    const onA = m.a.label===name || (m.a.players && m.a.players.includes(name));
    rec.played++;
    if(onA){ rec.pf+=m.scoreA; rec.pa+=m.scoreB; if(m.winner===m.a.id){rec.won++;} else rec.lost++; }
    else { rec.pf+=m.scoreB; rec.pa+=m.scoreA; if(m.winner===m.b.id){rec.won++;} else rec.lost++; }
  });
  return rec;
}
function matchCategory(t){ return t.matchType==="singles" ? "singles" : "doubles"; }
function allTournamentPlayerNames(t){
  const set = new Set();
  t.participants.forEach(p=>{ (p.players || [p.label]).forEach(n=>set.add(n)); });
  return [...set];
}
function championEnabled(t){ return t.crownChampion !== false; }
function extractPlayerMatchRecords(t, name){
  const out = [];
  let idx = 0;
  collectAllMatches(t).forEach(m=>{
    idx++;
    if(m.isBye || m.scoreA==null || m.scoreB==null || !matchInvolves(m, name)) return;
    const onA = m.a.label===name || (m.a.players && m.a.players.includes(name));
    const self = onA ? m.a : m.b;
    const opp = onA ? m.b : m.a;
    const scoreFor = onA ? m.scoreA : m.scoreB;
    const scoreAgainst = onA ? m.scoreB : m.scoreA;
    const won = m.winner === self.id;
    const partner = self.players ? (self.players.find(p=>p!==name) || null) : null;
    const opponents = opp.players ? opp.players.slice() : [opp.label];
    out.push({
      date: t.date, code: t.code, location: t.location, category: matchCategory(t),
      scoreFor, scoreAgainst, won, partner, opponents, seq: idx
    });
  });
  return out;
}
function computeStreaks(records){
  let current = {type:null, count:0};
  let maxWin = 0, maxLoss = 0, runWin = 0, runLoss = 0;
  records.forEach(r=>{
    if(r.won){ runWin++; runLoss=0; if(runWin>maxWin) maxWin=runWin; }
    else { runLoss++; runWin=0; if(runLoss>maxLoss) maxLoss=runLoss; }
  });
  if(records.length){
    const last = records[records.length-1];
    if(last.won){
      let c=0; for(let i=records.length-1;i>=0 && records[i].won;i--) c++;
      current = {type:"W", count:c};
    } else {
      let c=0; for(let i=records.length-1;i>=0 && !records[i].won;i--) c++;
      current = {type:"L", count:c};
    }
  }
  return {current, maxWin, maxLoss};
}
const ACHIEVEMENT_DEFS = {
  cleanSweep: {emoji:"🧹", title:"Clean Sweep", desc:"Won every game"},
  onFire: {emoji:"🔥", title:"On Fire", desc:"Won 5 in a row"},
  iceCold: {emoji:"❄️", title:"Ice Cold", desc:"Lost 5 in a row"},
  giantKiller: {emoji:"💀", title:"Giant Killer", desc:"Beat the highest-rated player"},
  nailBiter: {emoji:"🎯", title:"Nail Biter", desc:"Won by 2 points or less"},
  bigWin: {emoji:"💪", title:"Big Win", desc:"Won by 5+ points, opponent got on the board"},
  flawless: {emoji:"🛡️", title:"Flawless Win", desc:"Won without conceding a point"},
  dynamicDuo: {emoji:"🤝", title:"Dynamic Duo", desc:"Best partnership today"}
};
function computeSessionAchievements(t){
  const names = allTournamentPlayerNames(t);
  const counts = {}; names.forEach(n=>counts[n]={});
  const bump = (name,key)=>{ counts[name][key] = (counts[name][key]||0)+1; };
  const topRated = t.participants.filter(p=>p.dupr!=null).sort((a,b)=>b.dupr-a.dupr)[0];
  const topNames = topRated ? (topRated.players || [topRated.label]) : [];
  const perPlayerRecords = {};
  names.forEach(name=>{
    const recs = extractPlayerMatchRecords(t, name);
    perPlayerRecords[name] = recs;
    if(!recs.length) return;
    if(recs.every(r=>r.won)) counts[name].cleanSweep = 1;
    const streaks = computeStreaks(recs);
    if(streaks.maxWin>=5) counts[name].onFire = 1;
    if(streaks.maxLoss>=5) counts[name].iceCold = 1;
    recs.forEach(r=>{
      if(!r.won) return;
      const margin = r.scoreFor - r.scoreAgainst;
      if(topRated && !topNames.includes(name) && r.opponents.some(o=>topNames.includes(o))) bump(name,"giantKiller");
      if(margin>0 && margin<=2) bump(name,"nailBiter");
      else if(margin>=5 && r.scoreAgainst>0) bump(name,"bigWin");
      if(r.scoreAgainst===0) bump(name,"flawless");
    });
  });
  const pairStats = {};
  names.forEach(name=>{
    perPlayerRecords[name].forEach(r=>{
      if(!r.partner) return;
      const key = [name, r.partner].sort().join("__");
      if(!pairStats[key]) pairStats[key] = {players:[name,r.partner].sort(), wins:0, played:0};
      pairStats[key].played++;
      if(r.won) pairStats[key].wins++;
    });
  });
  const eligible = Object.values(pairStats).filter(p=>p.played>=2);
  const pool = eligible.length ? eligible : Object.values(pairStats);
  if(pool.length){
    const best = pool.slice().sort((a,b)=> (b.wins/b.played)-(a.wins/a.played))[0];
    if(best && best.wins/best.played >= 0.5){
      best.players.forEach(n=> { if(counts[n]) counts[n].dynamicDuo = 1; });
    }
  }
  return counts;
}
function renderAchievements(t){
  const counts = computeSessionAchievements(t);
  const entries = Object.entries(counts).filter(([n,c])=>Object.keys(c).length);
  if(!entries.length) return "";
  return `
    <div class="card">
      <p class="eyebrow">Session achievements</p>
      ${entries.map(([name,c])=>`
        <div class="history-row" style="align-items:flex-start;">
          <div class="loc" style="padding-top:4px;">${name}</div>
          <div style="display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end;">
            ${Object.entries(c).map(([key,n])=>{
              const b = ACHIEVEMENT_DEFS[key];
              return `<span class="streak-badge hot" title="${b.desc}">${b.emoji} ${b.title} &times;${n}</span>`;
            }).join("")}
          </div>
        </div>`).join("")}
      <div style="margin-top:12px; padding-top:12px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:3px;">
        ${Object.values(ACHIEVEMENT_DEFS).map(b=>`<p class="help" style="margin:0;"><b>${b.emoji} ${b.title}</b> &mdash; ${b.desc}</p>`).join("")}
      </div>
    </div>`;
}

const RESULTS_TABLE = [[0,4.5],[10,4.8],[20,5.2],[30,5.8],[40,6.4],[50,7.0],[60,7.8],[70,8.4],[80,9.0],[90,9.6],[100,10]];
function interpolateTable(x, table){
  if(x<=table[0][0]) return table[0][1];
  if(x>=table[table.length-1][0]) return table[table.length-1][1];
  for(let i=0;i<table.length-1;i++){
    const [x0,y0]=table[i], [x1,y1]=table[i+1];
    if(x>=x0 && x<=x1) return y0 + ((x-x0)/(x1-x0))*(y1-y0);
  }
  return table[table.length-1][1];
}
function resultsScore(winPct){ return interpolateTable(winPct, RESULTS_TABLE); }
function dominanceScore(avgMargin){
  const m = Math.max(-10, Math.min(10, avgMargin));
  const score = m>=0 ? 7 + (m/10)*3 : 7 + (m/10)*7;
  return Math.max(0, Math.min(10, score));
}
function consistencyScore(margins){
  if(margins.length<2) return 7;
  const mean = margins.reduce((s,x)=>s+x,0)/margins.length;
  const variance = margins.reduce((s,x)=>s+(x-mean)*(x-mean),0)/margins.length;
  const stdDev = Math.sqrt(variance);
  return Math.max(0, Math.min(10, 10 - stdDev*0.6));
}
function clutchScore(records){
  const close = records.filter(r=>Math.abs(r.scoreFor-r.scoreAgainst)<=2);
  if(!close.length) return 7;
  const wins = close.filter(r=>r.won).length;
  return (wins/close.length)*10;
}

  if(v>=6.0) return "Below Average";
  if(v>=5.5) return "Poor";
  return "Night to Forget";
}
async function getPlayerCareerProxy(name, excludeCode){
  const codes = await getPlayerIndex(name);
  let played=0, won=0, pf=0, pa=0;
  for(const code of codes.slice(0,15)){
    if(code===excludeCode) continue;
    const t = await loadTournamentByCode(code);
    if(!t) continue;
    const recs = extractPlayerMatchRecords(t, name);
    played += recs.length; won += recs.filter(r=>r.won).length;
    pf += recs.reduce((s,r)=>s+r.scoreFor,0); pa += recs.reduce((s,r)=>s+r.scoreAgainst,0);
  }
  if(played<3) return null;
  const winRate = won/played;
  const netPerGame = (pf-pa)/played;
  const proxy = 3.5 + (winRate-0.5)*3 + netPerGame*0.05;
  return Math.max(2.0, Math.min(6.0, proxy));
}
async function resolvePlayerStrength(name, t, cache){
  if(cache[name]) return cache[name];
  const dbEntry = state.playerDb.find(p=>p.name.toLowerCase()===name.toLowerCase());
  let value, source;
  if(dbEntry && dbEntry.dupr){ value = dbEntry.dupr; source = "dupr"; }
  else {
    const proxy = await getPlayerCareerProxy(name, t.code);
    if(proxy!=null){ value = proxy; source = "history"; }
    else { value = 3.5; source = "neutral"; }
  }
  cache[name] = {value, source};
  return cache[name];
}
async function computeOppositionScore(name, records, t, cache){
  const own = await resolvePlayerStrength(name, t, cache);
  const sourcesUsed = new Set([own.source]);
  let total = 0;
  for(const r of records){
    const oppStrengths = [];
    for(const opp of r.opponents){
      const s = await resolvePlayerStrength(opp, t, cache);
      oppStrengths.push(s.value);
      sourcesUsed.add(s.source);
    }
    const avgOppStrength = oppStrengths.reduce((a,b)=>a+b,0)/oppStrengths.length;
    const diff = avgOppStrength - own.value;
    total += r.won ? (7 + diff*2) : (7 + diff*1);
  }
  const score = Math.max(0, Math.min(10, total/records.length));
  let tag;
  if(sourcesUsed.has("dupr")) tag = "Based on DUPR";
  else if(sourcesUsed.has("history")) tag = "Estimated from history";
  else tag = "New players \u2014 limited data";
  return { score, tag };
}
async function computeKitchenRating(t, name, cache){
  const records = extractPlayerMatchRecords(t, name);
  if(records.length<3) return null;
  const wins = records.filter(r=>r.won).length;
  const winPct = (wins/records.length)*100;
  const margins = records.map(r=>r.scoreFor-r.scoreAgainst);
  const avgMargin = margins.reduce((a,b)=>a+b,0)/margins.length;
  const results = resultsScore(winPct);
  const dominance = dominanceScore(avgMargin);
  const consistency = consistencyScore(margins);
  const clutch = clutchScore(records);
  const { score: opposition, tag: oppositionTag } = await computeOppositionScore(name, records, t, cache);
  const overall = 0.40*results + 0.25*dominance + 0.15*opposition + 0.10*consistency + 0.10*clutch;
  return {
    overall: Math.round(overall*10)/10,
    results: Math.round(results*10)/10,
    dominance: Math.round(dominance*10)/10,
    opposition: Math.round(opposition*10)/10,
    consistency: Math.round(consistency*10)/10,
    clutch: Math.round(clutch*10)/10,
    oppositionTag,
    label: ratingLabel(overall)
  };
}

/* ============================= PARTNERSHIP STRENGTH INDEX ============================= */
async function getPlayerStrengthHistory(name, cache){
  if(cache.strength[name] !== undefined) return cache.strength[name];
  const codes = await getPlayerIndex(name);
  const entries = [];
  for(const code of codes.slice(0,25)){
    let t = cache.tCache[code];
    if(t===undefined){ t = await loadTournamentByCode(code); cache.tCache[code]=t; }
    if(!t) continue;
    const rating = await computeKitchenRating(t, name, cache.ratingCache);
    if(rating) entries.push({date:t.date, value:rating.overall});
  }
  entries.sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0));
  const recent = entries.slice(-8);
  let ws=0, wt=0;
  recent.forEach((e,i)=>{
    const rank = recent.length-1-i;
    const w = Math.pow(0.85, rank);
    ws += e.value*w; wt += w;
  });
  const strength = wt ? ws/wt : null;
  cache.strength[name] = strength;
  return strength;
}
async function resolvePairStrength(name, cache){
  let s = await getPlayerStrengthHistory(name, cache);
  if(s==null){
    const dbEntry = state.playerDb.find(p=>p.name.toLowerCase()===name.toLowerCase());
    if(dbEntry && dbEntry.dupr){
      // rough DUPR (~2.0-6.0) to Kitchen Rating (~0-10) scale, only used when no session history exists yet
      s = Math.max(4, Math.min(9, 4 + (dbEntry.dupr-2)*1.25));
    } else {
      s = 7.0; // neutral baseline, matching Kitchen Rating's own neutral opposition/dominance baseline
    }
  }
  return s;
}
function expectedWinProb(strengthA, strengthB, scale){
  scale = scale || 3;
  const diff = strengthA - strengthB;
  const p = 1/(1+Math.pow(10, -diff/scale));
  return Math.max(0.05, Math.min(0.95, p));
}
/* ============================= MATCHUP WIN PREDICTIONS ============================= */
async function teamKitchenStrength(players, cache){
  const vals = [];
  for(const name of players){
    const s = await getPlayerStrengthHistory(name, cache);
    if(s!=null) vals.push(s);
  }
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}
function teamDuprStrength(players){
  const vals = players.map(n=>{
    const p = state.playerDb.find(pp=>pp.name.toLowerCase()===n.toLowerCase());
    return (p && p.dupr!=null) ? p.dupr : null;
  }).filter(v=>v!=null);
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}
function teamFairnessStrength(players){
  const vals = players.map(n=>{
    const p = state.playerDb.find(pp=>pp.name.toLowerCase()===n.toLowerCase());
    return (p && p.fairness!=null) ? p.fairness : null;
  }).filter(v=>v!=null);
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}
async function computeGroupHeadToHead(teamAPlayers, teamBPlayers, cache){
  let winsA=0, lossesA=0;
  const seen = new Set();
  for(const pa of teamAPlayers){
    const codes = await getPlayerIndex(pa);
    for(const code of codes.slice(0,25)){
      let t = cache.tCache[code];
      if(t===undefined){ t = await loadTournamentByCode(code); cache.tCache[code]=t; }
      if(!t) continue;
      collectAllMatches(t).forEach(m=>{
        if(m.isBye || m.scoreA==null || m.scoreB==null || !m.a || !m.b) return;
        const aPlayers = m.a.players || [m.a.label];
        const bPlayers = m.b.players || [m.b.label];
        const key = t.code+"-"+m.id;
        if(seen.has(key)) return;
        const paOnA = aPlayers.includes(pa), paOnB = bPlayers.includes(pa);
        if(!paOnA && !paOnB) return;
        const paSideOpponents = paOnA ? bPlayers : aPlayers;
        if(!paSideOpponents.some(o=>teamBPlayers.includes(o))) return;
        seen.add(key);
        const paWon = paOnA ? m.winner===m.a.id : m.winner===m.b.id;
        if(paWon) winsA++; else lossesA++;
      });
    }
  }
  return {winsA, lossesA, total: winsA+lossesA};
}
function expectedScoreline(favoredProb){
  const diff = favoredProb - 0.5;
  if(diff < 0.04) return {winner:13, loser:11};
  if(diff < 0.09) return {winner:12, loser:10};
  const loserScore = Math.max(1, Math.min(9, Math.round(11 - diff*20)));
  return {winner:11, loser:loserScore};
}
async function computePairChemistry(p1, p2, cache){
  cache.chemistry = cache.chemistry || {};
  const key = [p1,p2].sort().join("|");
  if(cache.chemistry[key] !== undefined) return cache.chemistry[key];

  const strengthA = await resolvePairStrength(p1, cache);
  const strengthB = await resolvePairStrength(p2, cache);
  const teamStrength = (strengthA + strengthB) / 2;

  const codes = await getPlayerIndex(p1);
  let wins=0, expectedSum=0, games=0;
  const seen = new Set();
  for(const code of codes.slice(0,25)){
    let t = cache.tCache[code];
    if(t===undefined){ t = await loadTournamentByCode(code); cache.tCache[code]=t; }
    if(!t) continue;
    const matches = collectAllMatches(t).filter(m=>!m.isBye && m.a && m.b && m.scoreA!=null && m.scoreB!=null);
    for(const m of matches){
      const mkey = t.code+"-"+m.id;
      if(seen.has(mkey)) continue;
      const aPlayers = m.a.players || [m.a.label];
      const bPlayers = m.b.players || [m.b.label];
      const onA = aPlayers.includes(p1) && aPlayers.includes(p2);
      const onB = bPlayers.includes(p1) && bPlayers.includes(p2);
      if(!onA && !onB) continue;
      seen.add(mkey);
      const oppPlayers = onA ? bPlayers : aPlayers;
      if(oppPlayers.length<2) continue;
      const oppStrengthA = await resolvePairStrength(oppPlayers[0], cache);
      const oppStrengthB = await resolvePairStrength(oppPlayers[1], cache);
      const oppStrength = (oppStrengthA+oppStrengthB)/2;
      expectedSum += expectedWinProb(teamStrength, oppStrength);
      const won = onA ? m.winner===m.a.id : m.winner===m.b.id;
      if(won) wins++;
      games++;
    }
  }
  if(games<3){ cache.chemistry[key] = null; return null; }
  const rawChemistry = (wins/games) - (expectedSum/games);
  const dampen = games>=25 ? 0.9 : games>=10 ? 0.7 : 0.5; // shrink small samples toward zero effect
  const result = { value: rawChemistry*dampen, games };
  cache.chemistry[key] = result;
  return result;
}
async function computeMatchPrediction(m, cache){
  const teamAPlayers = m.a.players || [m.a.label];
  const teamBPlayers = m.b.players || [m.b.label];
  const probs = [];
  let h2hTotal = 0;

  const krA = await teamKitchenStrength(teamAPlayers, cache);
  const krB = await teamKitchenStrength(teamBPlayers, cache);
  if(krA!=null && krB!=null) probs.push(expectedWinProb(krA, krB, 3));

  const duprA = teamDuprStrength(teamAPlayers);
  const duprB = teamDuprStrength(teamBPlayers);
  if(duprA!=null && duprB!=null) probs.push(expectedWinProb(duprA, duprB, 1.2));

  const fairA = teamFairnessStrength(teamAPlayers);
  const fairB = teamFairnessStrength(teamBPlayers);
  if(fairA!=null && fairB!=null) probs.push(expectedWinProb(fairA, fairB, 18));

  const h2h = await computeGroupHeadToHead(teamAPlayers, teamBPlayers, cache);
  if(h2h.total>0){
    probs.push((h2h.winsA+1)/(h2h.total+2)); // smoothed toward 50% for small samples
    h2hTotal = h2h.total;
  }

  if(!probs.length){
    return { probA:0.5, probB:0.5, favored:"A", scoreline:{winner:13,loser:11}, confidence:"Low", signalsUsed:0 };
  }
  let probA = probs.reduce((a,b)=>a+b,0)/probs.length;

  let chemistryUsed = false;
  if(teamAPlayers.length===2){
    const chemA = await computePairChemistry(teamAPlayers[0], teamAPlayers[1], cache);
    if(chemA){ probA += chemA.value; chemistryUsed = true; }
  }
  if(teamBPlayers.length===2){
    const chemB = await computePairChemistry(teamBPlayers[0], teamBPlayers[1], cache);
    if(chemB){ probA -= chemB.value; chemistryUsed = true; }
  }
  probA = Math.max(0.05, Math.min(0.95, probA));

  const probB = 1-probA;
  const favored = probA>=probB ? "A" : "B";
  const favoredProb = Math.max(probA, probB);
  const scoreline = expectedScoreline(favoredProb);

  let points = probs.length;
  if(h2hTotal>=5) points++;
  if(chemistryUsed) points++;
  const confidence = points<=2 ? "Low" : points<=4 ? "Medium" : "High";

  return { probA, probB, favored, scoreline, confidence, signalsUsed: probs.length };
}
async function getMatchProbs(m, cache){
  if(m.prediction && m.prediction.probFavored!=null){
    const probFav = m.prediction.probFavored;
    return m.prediction.favored==="A" ? {probA:probFav, probB:1-probFav} : {probA:1-probFav, probB:probFav};
  }
  const pred = await computeMatchPrediction(m, cache);
  return {probA: pred.probA, probB: pred.probB};
}
async function computeSessionDifficulty(){
  const t = state.tournament;
  showToast("Calculating matchup difficulty\u2026");
  const cache = {tCache:{}, strength:{}, ratingCache:{}};
  const diffMap = {};
  const bump = (key, prob) => { if(!diffMap[key]) diffMap[key]={probSum:0,count:0}; diffMap[key].probSum += prob; diffMap[key].count++; };

  const anyPlayed = collectAllMatches(t).some(m=>!m.isBye && m.scoreA!=null && m.scoreB!=null);
  const skip = m => m.isBye || !m.a || !m.b || (anyPlayed && (m.scoreA==null || m.scoreB==null));

  if(t.format==="mixer" || (t.format==="freeplay" && t.freeplayMode==="doubles")){
    for(const r of t.mixerRounds){
      for(const m of r.matches){
        if(skip(m)) continue;
        const {probA, probB} = await getMatchProbs(m, cache);
        m.a.players.forEach(pn=>bump(pn, probA));
        m.b.players.forEach(pn=>bump(pn, probB));
      }
    }
  } else if(t.format==="roundrobin" || (t.format==="freeplay" && t.freeplayMode==="singles")){
    for(const m of t.matches){
      if(skip(m)) continue;
      const {probA, probB} = await getMatchProbs(m, cache);
      bump(m.a.id, probA); bump(m.b.id, probB);
    }
  } else if(t.format==="groups"){
    for(const g of t.groups){
      for(const m of g.matches){
        if(skip(m)) continue;
        const {probA, probB} = await getMatchProbs(m, cache);
        bump(m.a.id, probA); bump(m.b.id, probB);
      }
    }
  }

  const result = {};
  Object.keys(diffMap).forEach(k=>{
    const count = diffMap[k].count;
    const avgProb = count ? diffMap[k].probSum/count : null;
    if(avgProb==null){ result[k] = { expectedWinRate:null, expectedWins:null, expectedLosses:null, difficulty:null }; return; }
    const expectedWins = Math.round(avgProb*count);
    const expectedLosses = count - expectedWins;
    const roundedExpectedRate = count ? expectedWins/count : null;
    result[k] = {
      expectedWinRate: roundedExpectedRate,
      expectedWins, expectedLosses,
      difficulty: (1-avgProb)*10
    };
  });
  state.matchupDifficulty = result;
  state.matchupDifficultyIsForecast = !anyPlayed;
  render();
  showToast(anyPlayed ? "Matchup difficulty ready" : "Session forecast ready");
}
async function computeMatchPredictions(){
  const t = state.tournament;
  showToast("Calculating matchups\u2026");
  const cache = {tCache:{}, strength:{}, ratingCache:{}};
  const predictions = {};
  const matches = collectAllMatches(t).filter(m=>!m.isBye && m.a && m.b && m.a.id && m.b.id && m.scoreA==null && m.scoreB==null);
  for(const m of matches){
    const pred = await computeMatchPrediction(m, cache);
    predictions[m.id] = pred;
    m.prediction = { favored: pred.favored, probFavored: Math.round(Math.max(pred.probA,pred.probB)*1000)/1000, scoreline: pred.scoreline, confidence: pred.confidence, signalsUsed: pred.signalsUsed };
  }
  state.matchPredictions = predictions;
  await saveTournament(t);
  render();
  showToast("Predictions ready");
}
/* ============================= LIVE SCORING ENGINE (tested standalone, see build notes) ============================= */
function seedBracketFromGroups(qualifiersByGroup, groupCount, qualifiersPerGroup){
  let seededTeamIds;
  if(groupCount===2 && qualifiersPerGroup===2){
    const [A1,A2] = qualifiersByGroup[0];
    const [B1,B2] = qualifiersByGroup[1];
    seededTeamIds = [A1,B2, B1,A2];
  } else if(groupCount===4 && qualifiersPerGroup===1){
    const [A] = qualifiersByGroup[0], [B] = qualifiersByGroup[1], [C] = qualifiersByGroup[2], [D] = qualifiersByGroup[3];
    seededTeamIds = [A,C, B,D];
  } else {
    let tiers = [];
    for(let r=0;r<qualifiersPerGroup;r++) tiers.push(qualifiersByGroup.map(g=>g[r]));
    const flatSeeds = tiers.flat();
    const half = Math.ceil(flatSeeds.length/2);
    const h1 = flatSeeds.slice(0,half), h2 = flatSeeds.slice(half);
    seededTeamIds = [];
    for(let i=0;i<h1.length;i++){ seededTeamIds.push(h1[i]); if(h2[i]) seededTeamIds.push(h2[i]); }
  }
  const pairs = [];
  for(let i=0;i<seededTeamIds.length;i+=2) pairs.push([seededTeamIds[i], seededTeamIds[i+1]]);
  return pairs;
}
function makeTypickleBracket(pairs, teams){
  const round1 = pairs.map((pair,i)=>{
    const a = teams.find(t=>t.id===pair[0]) ? {id:pair[0], label:teams.find(t=>t.id===pair[0]).name} : {id:"BYE-"+i+"a", label:"Bye", bye:true};
    const b = teams.find(t=>t.id===pair[1]) ? {id:pair[1], label:teams.find(t=>t.id===pair[1]).name} : {id:"BYE-"+i+"b", label:"Bye", bye:true};
    return {
      id:"tko-1-"+i, round:1, a, b, matchCode:null, status:(a.bye||b.bye)?"complete":"scheduled", court:null,
      gamesWonA:null, gamesWonB:null, winner: a.bye?b.id:(b.bye?a.id:null), isBye:!!(a.bye||b.bye),
      pointsForA:null, pointsForB:null
    };
  });
  const rounds = [round1];
  let count = round1.length, r = 2;
  while(count>1){
    count/=2;
    const rm = [];
    for(let i=0;i<count;i++) rm.push({id:"tko-"+r+"-"+i, round:r, a:null, b:null, matchCode:null, status:"pending", court:null, gamesWonA:null, gamesWonB:null, winner:null, isBye:false, pointsForA:null, pointsForB:null});
    rounds.push(rm); r++;
  }
  propagateBracket(rounds);
  propagateBracket(rounds);
  propagateBracket(rounds);
  rounds.forEach(round=>round.forEach(m=>{ if(m.a && m.b && m.status==="pending") m.status="scheduled"; }));
  return rounds;
}
function typickleFindMatch(ev, matchId){
  for(const g of ev.groups){
    const m = g.matches.find(x=>x.id===matchId);
    if(m) return {match:m, location:"group", groupId:g.id};
  }
  if(ev.bracket){
    for(const round of ev.bracket){
      const m = round.find(x=>x.id===matchId);

async function confirmAndLockGroups(){

  const allComplete = ev.groups.every(g=>g.matches.every(m=>m.status==="complete"));
  if(!allComplete){ showToast("All group matches must be complete before locking"); return; }
  const qualifiersByGroup = ev.groups.map(g=>{
    const standings = computeGroupStandings(g, ev.teams);
    return standings.slice(0, ev.settings.qualifiersPerGroup).map(s=>s.id);
  });
  const pairs = seedBracketFromGroups(qualifiersByGroup, ev.settings.groupCount, ev.settings.qualifiersPerGroup);
  ev.bracket = makeTypickleBracket(pairs, ev.teams);
  ev.status = "knockout";
  if(ev.settings.hasThirdPlacePlayoff) ev.thirdPlaceMatch = null;
  try{
    await saveTypickleEvent(ev.code, ev);
  }catch(e){

async function syncTypickleResult(){
  const match = state.lsMatch;
  if(!match || !match.matchOver || !match.typickleRef || match.typickleResultSynced) return;
  const ref = match.typickleRef;
  try{
    const ev = await loadTypickleEvent(ref.eventCode);
    if(!ev) return;
    const found = typickleFindMatch(ev, ref.matchId);
    if(!found) return;
    const gm = found.match;
    let pointsForA=0, pointsForB=0;
    match.games.forEach(g=>{ pointsForA += g.scoreA; pointsForB += g.scoreB; });
    gm.status = "complete";
    gm.gamesWonA = match.gamesWonA; gm.gamesWonB = match.gamesWonB;
    gm.winner = match.matchWinner==="a" ? ref.teamAId : ref.teamBId;
    gm.pointsForA = pointsForA; gm.pointsForB = pointsForB;
    gm.matchCode = state.lsMatchCode;

    if(found.location==="bracket"){
      propagateBracket(ev.bracket);
      ev.bracket.forEach(round=>round.forEach(m=>{ if(m.a && m.b && m.status==="pending") m.status="scheduled"; }));
      // once both semifinal losers are known, populate the 3rd place match
      if(ev.settings.hasThirdPlacePlayoff && ev.bracket.length>=2){
        const semis = ev.bracket[ev.bracket.length-2];
        if(semis.length===2 && semis.every(m=>m.status==="complete") && !ev.thirdPlaceMatch){
          const loserOf = m => m.winner===m.a.id ? m.b : m.a;
          const l1 = loserOf(semis[0]), l2 = loserOf(semis[1]);
          if(!l1.bye && !l2.bye){
            ev.thirdPlaceMatch = { id:"tko-3rd", round:0, a:l1, b:l2, matchCode:null, status:"scheduled", court:null, gamesWonA:null, gamesWonB:null, winner:null, isBye:false, pointsForA:null, pointsForB:null };
          }
        }
      }
      if(ev.bracket[ev.bracket.length-1].every(m=>m.status==="complete")) ev.status = "complete";
    }

    await saveTypickleEvent(ref.eventCode, ev);
    match.typickleResultSynced = true;
    if(state.typickleEvent && state.typickleEvent.code===ref.eventCode) state.typickleEvent = ev;
    persistMatch();
  }catch(e){
    showToast("\u26a0\ufe0f Couldn't sync the result to the tournament \u2014 will retry");
  }
}

function buildLeadSwingSeries(game){
  const series = [{point:0, scoreA:0, scoreB:0, diff:0}];
  let scoreA=0, scoreB=0;
  game.eventLog.filter(e=>e.type==="rally").forEach((e,i)=>{
    if(e.rallyWinner===e.servingTeam){
      if(e.servingTeam==="a") scoreA++; else scoreB++;
    }
    series.push({point:i+1, scoreA, scoreB, diff:scoreA-scoreB});
  });
  return series;
}
function computeBiggestComeback(game){
  if(!game.winner) return 0;
  const series = buildLeadSwingSeries(game);
  let worstDeficit = 0;
  series.forEach(pt=>{
    const winnerDiff = game.winner==="a" ? pt.diff : -pt.diff;
    if(winnerDiff < worstDeficit) worstDeficit = winnerDiff;
  });
  return Math.abs(worstDeficit);
}
function computeServerWinRates(match){
  let aWins=0, aTotal=0, bWins=0, bTotal=0;
  match.games.forEach(g=>{
    g.eventLog.filter(e=>e.type==="rally").forEach(e=>{
      if(e.servingTeam==="a"){ aTotal++; if(e.rallyWinner==="a") aWins++; }
      else { bTotal++; if(e.rallyWinner==="b") bWins++; }
    });
  });
  return {
    a: aTotal ? Math.round((aWins/aTotal)*100) : null, aTotal,
    b: bTotal ? Math.round((bWins/bTotal)*100) : null, bTotal
  };
}
function renderMomentumChart(series, labelA, labelB){
  if(series.length<2) return `<div class="empty">Not enough rally data yet.</div>`;
  const w=560, h=190, padL=30, padR=14, padT=14, padB=24;
  const diffs = series.map(p=>p.diff);
  let yMin=Math.min(...diffs,-1), yMax=Math.max(...diffs,1);
  const pad = Math.max(1,(yMax-yMin)*0.15); yMin-=pad; yMax+=pad;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const xStep = plotW/(series.length-1);
  const yOf = v => padT + plotH - ((v-yMin)/(yMax-yMin))*plotH;
  const coords = series.map((p,i)=>[padL+i*xStep, yOf(p.diff)]);
  const pathD = coords.map((c,i)=>(i===0?"M":"L")+c[0].toFixed(1)+","+c[1].toFixed(1)).join(" ");
  const zy = yOf(0);
  return `
  <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block;">
    <line x1="${padL}" y1="${zy.toFixed(1)}" x2="${w-padR}" y2="${zy.toFixed(1)}" stroke="#5B7A76" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="${w-padR}" y="${padT+10}" font-size="9" fill="#5B7A76" text-anchor="end">${labelA} ahead</text>
    <text x="${w-padR}" y="${h-padB-4}" font-size="9" fill="#5B7A76" text-anchor="end">${labelB} ahead</text>
    <path d="${pathD}" fill="none" stroke="#0E5C55" stroke-width="2.5"/>
    ${coords.map((c,i)=>`<g><title>Rally ${series[i].point}: ${series[i].scoreA}-${series[i].scoreB}</title><circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="8" fill="transparent"/></g>`).join("")}
  </svg>`;
}

  let pool = f.players.filter(p=>!paired.has(p.name));
  if(balanced && pool.some(p=>p.dupr)){
    pool = pool.slice().sort((a,b)=>(b.dupr||0)-(a.dupr||0));
    while(pool.length>=2){ const hi=pool.shift(); const lo=pool.pop(); f.teams.push({players:[hi.name, lo.name], name:`Team ${f.teams.length+1}`}); }
  } else {
    pool = shuffle(pool);
    while(pool.length>=2){ f.teams.push({players:[pool.pop().name, pool.pop().name], name:`Team ${f.teams.length+1}`}); }
  }

function lsCreateInitialGameState(setup){
  const { teamAPlayers, teamBPlayers, servingTeam, firstServer, winTarget, winBy, initialPositions } = setup;

    positions = JSON.parse(JSON.stringify(initialPositions));
  } else {
    const servingPlayers = servingTeam==='a' ? teamAPlayers : teamBPlayers;
    const partner = servingPlayers.find(p=>p!==firstServer);
    const receivingPlayers = servingTeam==='a' ? teamBPlayers : teamAPlayers;
    const otherTeam = servingTeam==='a' ? 'b' : 'a';
    positions = {};
    positions[servingTeam] = { right: firstServer, left: partner };
    positions[otherTeam] = { right: receivingPlayers[0], left: receivingPlayers[1] };
  }
  return {
    setup, scoreA:0, scoreB:0, servingTeam, serverNum:1, isFirstServe:true,
    currentServer: firstServer, positions, winTarget, winBy, eventLog:[], gameOver:false, winner:null,
    orientation: setup.orientation, sidesSwitched: false

  next.games[idx] = lsApplyRally(next.games[idx], rallyWinnerTeam);
  const g = next.games[idx];
  if(g.gameOver){
    if(g.winner==="a") next.gamesWonA++; else next.gamesWonB++;
    const needed = Math.ceil(next.matchSetup.bestOf/2);
    if(next.gamesWonA>=needed || next.gamesWonB>=needed){
      next.matchOver = true;
      next.matchWinner = next.gamesWonA>next.gamesWonB ? "a" : "b";
    }
  }
  return next;
}
function lsUndoMatchRally(match){
  const next = JSON.parse(JSON.stringify(match));
  const idx = next.games.length-1;
  const g = next.games[idx];
  if(g.eventLog.length>0){
    next.games[idx] = lsUndoLastRally(g);
  } else if(idx>0){
    next.games.pop();
    const prevG = next.games[next.games.length-1];
    if(prevG.winner==="a") next.gamesWonA--; else next.gamesWonB--;
    next.matchOver = false; next.matchWinner = null;
  }
  return next;
}
function lsStartNextGame(match){
  if(!match.games.length) return match;
  const lastGame = lsCurrentGame(match);
  if(!lastGame.gameOver) return match;
  const loser = lastGame.winner==="a" ? "b" : "a"; // official rule: loser of previous game serves first next game
  const firstServer = lastGame.positions[loser].right;
  const newGameSetup = Object.assign({}, match.matchSetup, {
    servingTeam: loser, firstServer,
    orientation: lastGame.orientation,
    initialPositions: lastGame.positions
  });
  const next = JSON.parse(JSON.stringify(match));
  next.games.push(lsCreateInitialGameState(newGameSetup));
  return next;
}
function lsMatchScoreSummary(match){ return match.gamesWonA + "-" + match.gamesWonB; }
function lsSideOut(state){
  state.servingTeam = state.servingTeam==='a' ? 'b' : 'a';
  state.serverNum = 1;
  state.currentServer = state.positions[state.servingTeam].right;
}
function lsApplyRally(state, rallyWinnerTeam){
  if(state.gameOver) return state;
  const next = JSON.parse(JSON.stringify(state));
  const servingTeam = next.servingTeam;
  next.eventLog.push({ type:"rally", servingTeam, serverNum: next.serverNum, server: next.currentServer, rallyWinner: rallyWinnerTeam, scoreABefore: next.scoreA, scoreBBefore: next.scoreB });
  if(rallyWinnerTeam === servingTeam){
    if(servingTeam==='a') next.scoreA++; else next.scoreB++;
    const p = next.positions[servingTeam];
    next.positions[servingTeam] = { right: p.left, left: p.right };
  } else {
    if(next.isFirstServe){
      lsSideOut(next);
      next.isFirstServe = false;
    } else if(next.serverNum === 1){
      next.serverNum = 2;
      const p = next.positions[servingTeam];
      next.currentServer = (next.currentServer===p.right) ? p.left : p.right;
    } else {
      lsSideOut(next);
    }
  }
  const leaderScore = Math.max(next.scoreA, next.scoreB);
  const lead = Math.abs(next.scoreA-next.scoreB);
  if(leaderScore>=next.winTarget && lead>=next.winBy){ next.gameOver=true; next.winner = next.scoreA>next.scoreB ? 'a':'b'; }
  return next;
}
function lsUndoLastRally(state){
  if(!state.eventLog.length) return state;
  const remaining = state.eventLog.slice(0,-1);
  let fresh = lsCreateInitialGameState(state.setup);
  remaining.forEach(event=>{
    if(event.type==="rally") fresh = lsApplyRally(fresh, event.rallyWinner);
    else if(event.type==="switch") fresh = lsSwitchSides(fresh);
  });
  return fresh;
}
function lsScoreLabel(state){
  const servingScore = state.servingTeam==='a' ? state.scoreA : state.scoreB;
  const receivingScore = state.servingTeam==='a' ? state.scoreB : state.scoreA;
  const displayServerNum = state.isFirstServe ? 2 : state.serverNum;
  return servingScore+'-'+receivingScore+'-'+displayServerNum;
}

async function buildPartnershipIndex(){
  const cache = {tCache:{}, strength:{}, ratingCache:{}};
  const { data, error } = await sbClient.from("kv_store").select("key,value").like("key","tourney-%").limit(200);
  if(error) throw error;
  const tournaments = (data||[]).map(row=>{ try{ return JSON.parse(row.value); }catch(e){ return null; } }).filter(Boolean);
  tournaments.forEach(t=>{ if(t.code) cache.tCache[t.code]=t; });

  const pairMap = {};
  tournaments.forEach(t=>{
    const matches = collectAllMatches(t).filter(m=> m.a && m.a.players && m.b && m.b.players && !m.isBye && m.scoreA!=null && m.scoreB!=null);
    matches.forEach(m=>{
      const teamA = {players:m.a.players, won:m.winner===m.a.id, margin:m.scoreA-m.scoreB};
      const teamB = {players:m.b.players, won:m.winner===m.b.id, margin:m.scoreB-m.scoreA};
      [teamA, teamB].forEach(side=>{
        const [p1,p2] = side.players;
        if(!p1 || !p2 || p1===p2) return;
        const key = [p1,p2].sort().join(" & ");
        if(!pairMap[key]) pairMap[key] = {players:[p1,p2].sort(), matches:[]};
        const opp = side===teamA ? teamB : teamA;
        pairMap[key].matches.push({won:side.won, margin:side.margin, oppPlayers:opp.players, date:t.date});
      });
    });
  });

  const MIN_GAMES = 3;
  const results = [];
  for(const key of Object.keys(pairMap)){
    const pair = pairMap[key];
    if(pair.matches.length < MIN_GAMES) continue;
    const [pA, pB] = pair.players;
    const strengthA = await resolvePairStrength(pA, cache);
    const strengthB = await resolvePairStrength(pB, cache);
    const teamStrength = (strengthA+strengthB)/2;

    const sortedMatches = pair.matches.slice().sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0));
    let wins=0, marginSum=0, rewardSum=0, expectedSum=0, oppStrengthSum=0, oppScoreSum=0;
    let curStreak=0, maxStreak=0;
    for(const m of sortedMatches){
      const [o1,o2] = m.oppPlayers;
      const oppStrengthA = await resolvePairStrength(o1, cache);
      const oppStrengthB = await resolvePairStrength(o2, cache);
      const oppStrength = (oppStrengthA+oppStrengthB)/2;
      const expected = expectedWinProb(teamStrength, oppStrength);
      if(m.won){ wins++; curStreak = curStreak>=0?curStreak+1:1; }
      else { curStreak = curStreak<=0?curStreak-1:-1; }
      maxStreak = Math.max(maxStreak, curStreak);
      marginSum += m.margin;
      rewardSum += m.won ? (1-expected) : -expected;
      expectedSum += expected;
      oppStrengthSum += oppStrength;
      const diff = oppStrength - teamStrength;
      oppScoreSum += m.won ? (7+diff*2) : (7+diff*1);
    }
    const games = sortedMatches.length;
    const winRate = wins/games;
    const expectedWinRate = expectedSum/games;
    const chemistry = winRate - expectedWinRate;
    const avgMargin = marginSum/games;
    const avgOppStrength = oppStrengthSum/games;

    const adjustedWinScore = Math.max(0, Math.min(10, ((rewardSum/games)+1)/2*10));
    const chemistryScore = Math.max(0, Math.min(10, 5 + chemistry*20));
    const oppositionScore = Math.max(0, Math.min(10, oppScoreSum/games));
    const dominance = dominanceScore(avgMargin);
    const confidenceScore = games>=50?10:games>=25?8:games>=10?6:3;
    const confidenceLabel = games>=50?"Very High":games>=25?"High":games>=10?"Medium":"Low";

    const psi = 0.40*adjustedWinScore + 0.25*chemistryScore + 0.20*oppositionScore + 0.10*dominance + 0.05*confidenceScore;

    results.push({
      players: pair.players, games, wins, losses: games-wins, winRate, expectedWinRate, chemistry,
      avgMargin, avgOppStrength, maxStreak: Math.max(0,maxStreak), confidenceLabel,
      psi: Math.round(psi*10)/10
    });
  }
  results.sort((a,b)=> b.psi-a.psi);
  return results;
}

function buildOpponentMap(records, field){
  const map = {};
  records.forEach(r=>{
    const names = field==="opponents" ? r.opponents : (r.partner ? [r.partner] : []);
    names.forEach(n=>{
      if(!map[n]) map[n] = {name:n, wins:0, losses:0, played:0, marginSum:0};
      map[n].played++;
      if(r.won) map[n].wins++; else map[n].losses++;
      map[n].marginSum += (r.scoreFor - r.scoreAgainst);
    });
  });
  return Object.values(map).sort((a,b)=> b.played-a.played);
}
function buildTimeSeries(records){
  const sessionOrder = [];
  const sessionMap = {};
  records.forEach(r=>{
    if(!sessionMap[r.code]){
      sessionMap[r.code] = { code:r.code, date:r.date, location:r.location, wins:0, games:0, netSum:0 };
      sessionOrder.push(r.code);
    }
    const s = sessionMap[r.code];
    s.games++; if(r.won) s.wins++; s.netSum += (r.scoreFor - r.scoreAgainst);
  });
  return sessionOrder.map((code,i)=>{
    const s = sessionMap[code];
    const winRate = (s.wins/s.games)*100;
    const netPerGame = s.netSum/s.games;
    const tooltip = `${s.date} \u2014 ${s.wins}-${s.games-s.wins} this session (net ${netPerGame>0?"+":""}${netPerGame.toFixed(1)}/game) \u00b7 ${s.location}`;
    return { date:s.date, x:i+1, winRate, netPerGame, tooltip };
  });
}
function summarizeCategory(records){
  if(!records.length) return null;
  const won = records.filter(r=>r.won).length;
  const lost = records.length - won;
  const pf = records.reduce((s,r)=>s+r.scoreFor,0);
  const pa = records.reduce((s,r)=>s+r.scoreAgainst,0);
  const streaks = computeStreaks(records);
  const opponents = buildOpponentMap(records, "opponents");
  const partners = buildOpponentMap(records, "partner");
  const eligiblePartners = partners.filter(p=>p.played>=2);
  const eligibleOpponents = opponents.filter(o=>o.played>=2);
  const partnerScore = p => (p.wins/p.played) + (p.marginSum/p.played)/20;
  const rivalScore = o => (o.losses/o.played) - (o.marginSum/o.played)/20;
  const bestPartner = (eligiblePartners.length?eligiblePartners:partners).slice().sort((a,b)=> partnerScore(b)-partnerScore(a))[0] || null;
  const biggestRival = (eligibleOpponents.length?eligibleOpponents:opponents).slice().sort((a,b)=> rivalScore(b)-rivalScore(a))[0] || null;
  return {
    played: records.length, won, lost, winRate: won/records.length,
    netPerGame: (pf-pa)/records.length,
    streaks, opponents, partners, bestPartner, biggestRival,
    timeSeries: buildTimeSeries(records)
  };
}

function renderLineChart(points, opts){
  if(!points || points.length<2) return `<div class="empty">Play one more session to start seeing a trend line here.</div>`;
  const w = 560, h = 190, padL = 42, padR = 14, padT = 14, padB = 26;
  const fmt = opts.yFormat || (v=>Math.round(v*10)/10);
  const values = points.map(p=>p[opts.field]);
  const explicitBounds = opts.yMin!==undefined && opts.yMax!==undefined;
  let yMin = opts.yMin!==undefined ? opts.yMin : Math.min(...values);
  let yMax = opts.yMax!==undefined ? opts.yMax : Math.max(...values);
  if(yMax===yMin){ yMax+=1; yMin-=1; }
  if(!explicitBounds){ const pad2 = (yMax-yMin)*0.12; yMin-=pad2; yMax+=pad2; }
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const xStep = points.length>1 ? plotW/(points.length-1) : 0;
  const yOf = v => padT + plotH - ((v-yMin)/(yMax-yMin))*plotH;
  const coords = points.map((p,i)=> [padL + i*xStep, yOf(p[opts.field])]);
  const pathD = coords.map((c,i)=> (i===0?"M":"L")+c[0].toFixed(1)+","+c[1].toFixed(1)).join(" ");
  const areaD = pathD + ` L${coords[coords.length-1][0].toFixed(1)},${padT+plotH} L${coords[0][0].toFixed(1)},${padT+plotH} Z`;
  const tickIdxs = [...new Set([0, Math.floor((points.length-1)/2), points.length-1])];
  const xTicks = tickIdxs.map(i=>`<text x="${coords[i][0].toFixed(1)}" y="${h-8}" font-size="9" fill="#5B7A76" text-anchor="middle">${points[i].date.slice(5)}</text>`).join("");
  const yTickCount = 4;
  let yGrid = "", yLabels = "";
  for(let i=0;i<=yTickCount;i++){
    const v = yMin + (yMax-yMin)*(i/yTickCount);
    const y = yOf(v);
    yGrid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="#E4DFCB" stroke-width="1"/>`;
    yLabels += `<text x="${padL-6}" y="${(y+3).toFixed(1)}" font-size="9" fill="#5B7A76" text-anchor="end">${fmt(v)}</text>`;
  }
  const dots = coords.map((c,i)=>`
    <g>
      <title>${points[i].tooltip || points[i].date+": "+fmt(points[i][opts.field])}</title>
      <circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="9" fill="transparent"/>
      <circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.5" fill="${opts.color}"/>
    </g>`).join("");
  let zeroLine = "";
  if(yMin<0 && yMax>0){
    const zy = yOf(0);
    zeroLine = `<line x1="${padL}" y1="${zy.toFixed(1)}" x2="${w-padR}" y2="${zy.toFixed(1)}" stroke="#5B7A76" stroke-width="1" stroke-dasharray="3,3"/>`;
  }
  return `
  <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block; cursor:default;">
    ${yGrid}
    ${zeroLine}
    <path d="${areaD}" fill="${opts.color}" opacity="0.14" stroke="none"/>
    <path d="${pathD}" fill="none" stroke="${opts.color}" stroke-width="2.5"/>
    ${dots}
    ${yLabels}
    ${xTicks}
  </svg>
  <p class="help" style="margin-top:4px;">Hover a point to see that session's result.</p>`;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function assignCourts(roundGroups, numCourts){
  const n = Math.max(1, numCourts||1);
  roundGroups.forEach(group=>{
    const matches = Array.isArray(group) ? group : group.matches;
    let idx=0;
    matches.forEach(m=>{
      if(m.isBye || !m.a || !m.b) return;
      m.court = (idx % n) + 1;
      idx++;
    });
  });
}
function assignCourtsToFlatMatches(matches, numCourts){

}
function generateRoundRobin(participants){
  let arr = participants.slice();
  if(arr.length%2!==0) arr.push({id:"BYE-"+Math.random().toString(36).slice(2,6), label:"Bye", bye:true});
  const n = arr.length;
  const rounds = [];
  for(let r=0;r<n-1;r++){
    const roundMatches=[];
    for(let i=0;i<n/2;i++){
      const a=arr[i], b=arr[n-1-i];
      roundMatches.push({
        id:"rr-"+r+"-"+i, round:r+1, a, b, scoreA:null, scoreB:null,
        winner: a.bye ? b.id : (b.bye ? a.id : null), isBye: !!(a.bye||b.bye)
      });
    }
    rounds.push(roundMatches);
    arr.splice(1,0,arr.pop());
  }
  return rounds.flat();
}
function roundRobinPairs(participants){
