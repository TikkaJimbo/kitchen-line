/* ============================= VIEW / LIVE BRACKET ============================= */
function renderView(){
  if(state.loading) return `<div class="empty">Loading tournament…</div>`;
  const t = state.tournament;
  if(!t) return `
    <div class="card">
      <h2>Can't find that court code</h2>
      <p class="sub">Double-check the code and try again.</p>
      <div class="join-row">
        <input type="text" id="joinCodeInput2" maxlength="6" placeholder="e.g. 7QXPB">
        <button class="btn btn-ink" data-action="join2">Go</button>
      </div>
    </div>`;

  let body = "";
  let champion = null;
  let championStatusLabel = "Champion";
  let crossoverStandings = null;
  const ended = t.ended === true;

  if(t.format==="mixer" || (t.format==="freeplay" && t.freeplayMode==="doubles")){
    const playerNames = t.participants.map(p=>p.label);
    const standings = computeMixerStandings(playerNames, t.mixerRounds);
    const allDone = t.mixerRounds.every(r=>r.matches.every(m=>m.scoreA!=null && m.scoreB!=null));
    const finalized = allDone || ended;
    if(championEnabled(t) && standings.length){
      if(finalized){ champion = standings[0]; championStatusLabel = "Champion"; }
      else if(t.format==="freeplay"){ champion = standings[0]; championStatusLabel = "Leading"; }
    }
    crossoverStandings = t.format==="mixer" ? standings : null;
    body += renderStandingsTable(standings);
    if(t.format==="freeplay"){
      if(!ended) body += renderFreeplayAddMatch(t);
      if(t.mixerRounds[0].matches.length){
        body += `<div class="round-label">Matches played</div>`;
        t.mixerRounds[0].matches.slice().reverse().forEach(m=> body += renderMatchCard(m, t, "mx", !ended));
      }
    } else {
      t.mixerRounds.forEach(r=>{
        body += `<div class="round-label">Round ${r.round}${r.sitOut.length ? " — sitting out: "+r.sitOut.join(", ") : ""}</div>`;
        r.matches.forEach(m=> body += renderMatchCard(m, t, "mx", !ended));
      });
    }
  } else if(t.format==="roundrobin" || (t.format==="freeplay" && t.freeplayMode==="singles")){
    const standings = computeStandings(t.participants, t.matches);
    const finalized = (t.format==="roundrobin" && allMatchesDone(t.matches)) || ended;
    if(championEnabled(t) && standings.length){
      if(finalized){ champion = standings[0]; championStatusLabel = "Champion"; }
      else if(t.format==="freeplay"){ champion = standings[0]; championStatusLabel = "Leading"; }
    }
    if(t.matchType==="singles" && t.format!=="freeplay") crossoverStandings = standings;
    body += renderStandingsTable(standings);
    if(t.format==="freeplay"){
      if(!ended) body += renderFreeplayAddMatch(t);
      if(t.matches.length){
        body += `<div class="round-label">Matches played</div>`;
        t.matches.slice().reverse().forEach(m=> body += renderMatchCard(m, t, "rr", !ended));
      }
    } else {
      body += renderMatchList(t.matches, t, null, !ended);
    }
  } else {
    // groups + knockout
    const allGroupMatches = t.groups.flatMap(g=>g.matches);
    body += `<div class="round-label">Group stage</div>`;
    t.groups.forEach(g=>{
      const st = computeStandings(g.participants, g.matches);
      body += `<div class="group-block"><h3>${g.name}</h3>${renderStandingsTable(st, t.advancePerGroup)}</div>`;
    });
    body += renderMatchList(allGroupMatches, t, "grp", !ended);
    body += `<div class="round-label" style="margin-top:24px;">Knockout</div>`;
    if(!t.bracket){
      const groupsDone = t.groups.every(g=>allMatchesDone(g.matches));
      if(groupsDone && !ended){
        body += `<div class="empty">Group stage complete. <br><button class="btn btn-ink btn-sm" style="margin-top:10px;" data-action="start-knockout">Seed the knockout bracket</button></div>`;
      } else if(!ended){
        body += `<div class="empty">Bracket unlocks once every group match has a score.</div>`;
      }
    } else {
      t.bracket.forEach((round,ri)=>{
        body += `<div class="round-label">${bracketRoundName(ri, t.bracket.length)}</div>`;
        body += renderMatchList(round, t, "ko", !ended);
      });
      const finalRound = t.bracket[t.bracket.length-1];
      if(finalRound && finalRound.length===1 && finalRound[0].winner && !finalRound[0].isBye && championEnabled(t)){
        const wId = finalRound[0].winner;
        const wObj = finalRound[0].a.id===wId ? finalRound[0].a : finalRound[0].b;
        champion = {label: wObj.label};
        championStatusLabel = "Champion";
      }
    }
  }

  if(crossoverStandings && !ended) body += renderCrossoverSection(t, crossoverStandings);
  else if(t.crossoverFinal) body += `<div class="round-label">Crossover Final</div>${renderMatchCard(t.crossoverFinal, t, "cx", !ended)}`;

  const canAddMore = !ended && (t.format==="mixer" || t.format==="roundrobin" || (t.format==="groups" && !t.bracket));

  return `
    <button class="back-link" data-action="go-home">&larr; Back</button>
    <div class="thead">
      <div>
        <h2 class="display" style="font-size:26px;"><span class="player-link" data-action="view-location" data-name="${t.location}">${t.location}</span></h2>
        <div class="meta">
          <span>${t.date}</span>
          <span>${t.matchType==="doubles"?"Doubles":t.matchType==="mixer"?"Doubles (rotating)":"Singles"}</span>
          <span>${formatLabel(t)}</span>
          ${ended ? `<span style="color:var(--red);">&#9679; Session ended</span>` : ""}
        </div>
      </div>
      <div class="code-pill">${t.code}</div>
    </div>
    ${canAddMore ? `<button class="btn btn-outline btn-sm" data-action="add-more-games" style="margin-bottom:14px;">+ Add another round of games</button>` : ""}
    ${!ended && t.format!=="groups" ? renderAddPlayerToSession(t) : ""}
    ${!ended && (t.format==="roundrobin" || t.format==="mixer") ? renderManualAddMatch(t) : ""}
    ${champion ? `<div class="champion-banner"><div class="lbl">🏆 ${championStatusLabel}</div><div class="name">${champion.label}</div></div>` : ""}
    ${t.crossoverFinal && t.crossoverFinal.winner ? `<div class="champion-banner" style="background:var(--kitchen);"><div class="lbl">🎾 Crossover Final Winner</div><div class="name">${(t.crossoverFinal.a.id===t.crossoverFinal.winner ? t.crossoverFinal.a : t.crossoverFinal.b).label}</div></div>` : ""}
    ${renderAchievements(t)}
    ${renderSessionPredictionsReport(t)}
    ${renderKitchenRatings(t)}
    ${renderPredictionsToggle()}
    ${renderDifficultyToggle()}
    ${body}
    <div class="chip-group" style="margin-top:10px;">
      <button class="btn btn-outline btn-sm" data-action="copy-link-view">Copy shareable link</button>
      <button class="btn btn-outline btn-sm" data-action="copy-code-view">Copy code</button>
      <button class="btn btn-outline btn-sm" data-action="share-whatsapp-view">Share on WhatsApp</button>
      <button class="btn btn-ink btn-sm" data-action="generate-result-card">📸 Result card</button>
      ${!ended ? `<button class="btn btn-outline btn-sm" style="border-color:var(--red); color:var(--red);" data-action="end-session">End session</button>` : ""}
    </div>
  `;
}

function renderProfile(){
  if(state.loading) return `<div class="empty">Loading profile…</div>`;
  const p = state.profile;
  if(!p) return `<button class="back-link" data-action="go-back-from-profile">&larr; Back</button><div class="card"><h2>No record yet</h2><p class="sub">This player hasn't appeared in a saved tournament, or the name doesn't match exactly.</p></div>`;
  return `
    <button class="back-link" data-action="go-back-from-profile">&larr; Back</button>
    <div class="card">
      <div class="profile-head">
        <div class="profile-avatar">${p.name.charAt(0).toUpperCase()}</div>
        <div>
          <h2 style="margin-bottom:0;">${p.name}</h2>
          <p class="sub" style="margin:2px 0 0;">${p.dupr ? "DUPR "+p.dupr : "No DUPR on file"} &middot; ${p.tournamentCount} session${p.tournamentCount===1?"":"s"} &middot; ${p.totalMatches} game${p.totalMatches===1?"":"s"}${p.avgRating!=null ? ` &middot; \u2b50 ${p.avgRating.toFixed(1)} avg rating` : ""}</p>
        </div>
      </div>
    </div>
    ${renderPassport(p)}
    ${renderAchievementBreakdown(p)}
    ${renderCareerBadges(p)}
    ${renderRatingChart(p)}
    ${p.singles ? renderCategoryBlock("Singles", "🎾", p.singles, false) : ""}
    ${p.doubles ? renderCategoryBlock("Doubles", "🤝", p.doubles, true) : ""}
    <div class="card">
      <p class="eyebrow">Recent sessions</p>
      ${p.history.length ? p.history.map(h=>`
        <div class="history-row">
          <div><span class="loc">${h.location}</span> &middot; ${h.date}</div>
          <div><span class="rec">${h.won}-${h.lost}</span> &middot; <span class="player-link" data-action="view-profile-code" data-code="${h.code}">${h.code}</span></div>
        </div>`).join("") : `<p class="help">No completed matches logged yet.</p>`}
    </div>
  `;
}

function renderPassport(p){
  return `
    <div class="category-block" style="background:var(--ink); color:var(--kitchen); border-color:var(--ink);">
      <h3 style="color:var(--ball);">🛂 Pickleball Passport</h3>
      <p class="sub" style="color:#B9CFCB; margin-top:0;">${p.memberSince ? "Playing since "+p.memberSince : "New player"}</p>
      <div class="stat-grid cols-${p.avgRating!=null?6:5}">
        <div class="stat-tile" style="background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.2);"><div class="num" style="color:var(--kitchen);">${p.courtsVisited.length}</div><div class="lbl" style="color:#B9CFCB;">Courts visited</div></div>

function renderTierProgress(trackLabel, emoji, tiers, currentValue){
  const achievedTiers = tiers.filter(t=>currentValue>=t);
  const highestAchieved = achievedTiers.length ? achievedTiers[achievedTiers.length-1] : null;
  const nextTier = tiers.find(t=>currentValue<t) || null;
  if(highestAchieved===null){
    const target = tiers[0];
    const pct = Math.max(2, Math.min(100, (currentValue/target)*100));
    return `
      <div class="milestone-row">
        <div class="milestone-label">${emoji} ${target} ${trackLabel}</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;"></div></div>
        <div class="progress-text">${currentValue}/${target} \u2014 ${target-currentValue} to go</div>
      </div>`;
  }
  let html = `<div class="milestone-row"><div class="milestone-label earned">${emoji} ${highestAchieved} ${trackLabel} \u2713</div>`;
  if(nextTier){
    const pct = Math.max(2, Math.min(100, (currentValue/nextTier)*100));
    html += `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%;"></div></div><div class="progress-text">${currentValue}/${nextTier} \u2014 ${nextTier-currentValue} to go</div>`;
  } else {
    html += `<div class="progress-text">Top tier reached \ud83c\udf89</div>`;
  }
  html += `</div>`;
  return html;
}

function renderMatchCard(m, t, ctx, editable){

  }

  const predTag = pred ? `<div class="predict-tag">${pred.favored==="A"?m.a.label:m.b.label} favored ${Math.round(Math.max(pred.probA,pred.probB)*100)}% \u00b7 Predicted ${pred.scoreline.winner}-${pred.scoreline.loser} \u00b7 ${pred.confidence} confidence</div>` : (done && m.prediction ? renderPredictionResult(m) : "");
  if(!scoreEditable){

      <div class="match-card ${done?"done":""}">
        ${courtTag}
        <div class="side ${aWin?"win":""}">${m.a.label}</div>
        <div class="side" style="text-align:center; flex:0; min-width:60px; font-weight:800;">${done?`${m.scoreA} – ${m.scoreB}`:"—"}</div>

      ${predTag}
    </div>`;
}

async function addPlayerToSession(){
  const t = state.tournament;
  const nameEl = document.getElementById("addp-name");
  const duprEl = document.getElementById("addp-dupr");
  const name = nameEl.value.trim();
  if(!name){ showToast("Enter a player name"); return; }
  const already = t.participants.some(p=> p.label===name || (p.players && p.players.includes(name)));
  if(already){ showToast(`${name} is already in this session`); return; }
  const duprVal = duprEl.value.trim();
  const dupr = duprVal ? parseFloat(duprVal) : null;

  const priorParticipants = t.participants.slice();
  const newParticipant = {id:"p-add-"+Date.now(), label:name, dupr};
  t.participants.push(newParticipant);

  if(t.format==="roundrobin"){
    const maxRound = t.matches.length ? Math.max(...t.matches.map(m=>m.round)) : 0;
    let i=0;
    priorParticipants.forEach(p=>{
      if(p.bye) return;
      i++;
      t.matches.push({id:"add-"+Date.now()+"-"+i, round:maxRound+1, a:newParticipant, b:p, scoreA:null, scoreB:null, winner:null, isBye:false});
    });
  } else if(t.format==="mixer"){
    const fullList = t.participants.map(p=>({name:p.label, dupr:p.dupr}));
    const {opponentCounts, usedPartnerships} = buildTrackersFromMixerRounds(t.mixerRounds);
    let bestOrder=null, bestOverlap=Infinity;
    for(let attempt=0; attempt<8; attempt++){
      const candidate = shuffle(fullList);
      const overlap = previewPartnershipOverlap(candidate, fullList.length-1, usedPartnerships);
      if(overlap<bestOverlap){ bestOverlap=overlap; bestOrder=candidate; }
      if(bestOverlap===0) break;
    }
    const extra = generateMixerRounds(bestOrder, buildFairnessMap(), opponentCounts, usedPartnerships);
    const maxRound = t.mixerRounds.length ? Math.max(...t.mixerRounds.map(r=>r.round)) : 0;
    extra.forEach(r=>{ r.round += maxRound; r.matches.forEach(m=>{ m.round=r.round; m.id=m.id+"-add"+Date.now(); }); });
    assignCourts(extra, t.courts);
    t.mixerRounds = t.mixerRounds.concat(extra);
  }
  // freeplay: no auto-scheduling needed — they're simply now selectable in "Add a match"

  await saveTournament(t);
  await upsertPlayers([{name, dupr}]);
  await addToPlayerIndex(name, t.code);
  state.playerDb = await loadPlayerDb();
  state.kitchenRatings = null; state.expandedRating = null; state.matchPredictions = null; state.matchupDifficulty = null;
  render();

async function addManualMatch(){
  const t = state.tournament;
  const scoreAEl = document.getElementById("manual-scoreA"), scoreBEl = document.getElementById("manual-scoreB");
  const scoreA = scoreAEl.value===""? null : +scoreAEl.value;
  const scoreB = scoreBEl.value===""? null : +scoreBEl.value;
  if((scoreA!=null || scoreB!=null) && (scoreA==null || scoreB==null || scoreA===scoreB)){ showToast("Enter two different scores, or leave both blank"); return; }

  let aObj, bObj;
  if(t.format==="roundrobin"){
    const aId = document.getElementById("manual-a").value, bId = document.getElementById("manual-b").value;
    if(!aId || !bId || aId===bId){ showToast("Pick two different sides"); return; }
    aObj = t.participants.find(p=>p.id===aId);
    bObj = t.participants.find(p=>p.id===bId);
    if(!aObj || !bObj) return;
  } else {
    const a1=document.getElementById("manual-a1").value, a2=document.getElementById("manual-a2").value;
    const b1=document.getElementById("manual-b1").value, b2=document.getElementById("manual-b2").value;
    const names=[a1,a2,b1,b2];
    if(names.some(n=>!n)){ showToast("Pick all 4 players"); return; }
    if(new Set(names).size<4){ showToast("Each player can only appear once"); return; }
    aObj = {id:"man-a-"+Date.now(), label:a1+" & "+a2, players:[a1,a2]};
    bObj = {id:"man-b-"+Date.now()+"x", label:b1+" & "+b2, players:[b1,b2]};
  }

  const winner = (scoreA!=null && scoreB!=null) ? (scoreA>scoreB ? aObj.id : bObj.id) : null;
  const courtEl = document.getElementById("manual-court");
  const court = courtEl ? +courtEl.value : undefined;
  const match = {id:"man-"+Date.now(), round:0, a:aObj, b:bObj, scoreA, scoreB, winner, isBye:false};
  if(court) match.court = court;

  if(t.format==="roundrobin"){
    const maxRound = t.matches.length ? Math.max(...t.matches.map(m=>m.round)) : 0;
    match.round = maxRound+1;
    t.matches.push(match);
  } else {
    const maxRound = t.mixerRounds.length ? Math.max(...t.mixerRounds.map(r=>r.round)) : 0;
    match.round = maxRound+1;
    t.mixerRounds.push({round: match.round, matches:[match], sitOut:[]});
  }

  await saveTournament(t);
  state.kitchenRatings = null; state.expandedRating = null; state.matchPredictions = null; state.matchupDifficulty = null;
  render();
  showToast("Match added");
}

function computeCardSummary(t){
  let champion = null, standingsList = [], statusLabel = "Leaderboard";
  const crown = championEnabled(t);
  const ended = t.ended === true;
  const freeplayCrown = t.format==="freeplay" && crown;
  if(t.format==="mixer" || (t.format==="freeplay" && t.freeplayMode==="doubles")){
    const standings = computeMixerStandings(t.participants.map(p=>p.label), t.mixerRounds);
    const done = (t.format==="mixer" && t.mixerRounds.every(r=>r.matches.every(m=>m.scoreA!=null && m.scoreB!=null))) || ended;
    if(done && standings.length && crown){ champion = standings[0].label; statusLabel = "Champion"; }
    else if(freeplayCrown && standings.length){ champion = standings[0].label; statusLabel = "Leading"; }
    standingsList = standings.map(s=>({label:s.label, rec:`${s.won}-${s.lost}`}));
  } else if(t.format==="roundrobin" || (t.format==="freeplay" && t.freeplayMode==="singles")){
    const standings = computeStandings(t.participants, t.matches);
    const done = (t.format==="roundrobin" && allMatchesDone(t.matches)) || ended;
    if(done && standings.length && crown){ champion = standings[0].label; statusLabel = "Champion"; }
    else if(freeplayCrown && standings.length){ champion = standings[0].label; statusLabel = "Leading"; }
    standingsList = standings.map(s=>({label:s.label, rec:`${s.won}-${s.lost}`}));
  } else {
    if(t.bracket){
      const finalRound = t.bracket[t.bracket.length-1];
      if(finalRound && finalRound.length===1 && finalRound[0].winner && !finalRound[0].isBye && crown){
        const fm = finalRound[0];
        champion = (fm.a.id===fm.winner ? fm.a : fm.b).label;
        statusLabel = "Champion";
      } else if(ended){
        statusLabel = "Session ended";
      } else {
        statusLabel = "Knockout in progress";
      }
    } else if(ended){
      statusLabel = "Session ended";
    } else {
      statusLabel = "Group stage leaders";
    }
    standingsList = t.groups.map(g=>{
      const st = computeStandings(g.participants, g.matches);
      return st.length ? {label: `${g.name}: ${st[0].label}`, rec: `${st[0].won}-${st[0].lost}`} : null;
    }).filter(Boolean);
  }
  if(t.crossoverFinal && t.crossoverFinal.winner && crown){
    const cf = t.crossoverFinal;
    const w = cf.a.id===cf.winner ? cf.a : cf.b;
    if(!champion){ champion = w.label; statusLabel = "Crossover Final Winner"; }
  }
  return { champion, standingsList, statusLabel };
}

async function addMoreGames(){
  const t = state.tournament;
  if(t.format==="mixer"){
    const maxRound = t.mixerRounds.length ? Math.max(...t.mixerRounds.map(r=>r.round)) : 0;
    const playerList = t.participants.map(p=>({name:p.label, dupr:p.dupr}));
    const {opponentCounts, usedPartnerships} = buildTrackersFromMixerRounds(t.mixerRounds);
    let bestOrder=null, bestOverlap=Infinity;
    for(let attempt=0; attempt<8; attempt++){
      const candidate = shuffle(playerList);
      const overlap = previewPartnershipOverlap(candidate, playerList.length-1, usedPartnerships);
      if(overlap<bestOverlap){ bestOverlap=overlap; bestOrder=candidate; }
      if(bestOverlap===0) break;
    }
    const extra = generateMixerRounds(bestOrder, buildFairnessMap(), opponentCounts, usedPartnerships);
    extra.forEach(r=>{ r.round += maxRound; r.matches.forEach(m=>{ m.round=r.round; m.id=m.id+"-x"+maxRound; }); });
    assignCourts(extra, t.courts);
    t.mixerRounds = t.mixerRounds.concat(extra);
  } else if(t.format==="roundrobin"){
    const maxRound = t.matches.length ? Math.max(...t.matches.map(m=>m.round)) : 0;
    const extra = generateRoundRobin(t.participants);
    extra.forEach(m=>{ m.round+=maxRound; m.id=m.id+"-x"+maxRound; });
    assignCourtsToFlatMatches(extra, t.courts);
    t.matches = t.matches.concat(extra);
  } else if(t.format==="groups" && !t.bracket){
    t.groups.forEach(g=>{
      const maxRound = g.matches.length ? Math.max(...g.matches.map(m=>m.round)) : 0;
      const extra = generateRoundRobin(g.participants);
      extra.forEach(m=>{ m.round+=maxRound; m.id=m.id+"-x"+maxRound; });
      assignCourtsToFlatMatches(extra, t.courts);
      g.matches = g.matches.concat(extra);
    });
  } else {
    showToast("Can't add more league games once the knockout bracket has started");
    return;
  }
  await saveTournament(t);
  haptic("medium");
  render();
  showToast("Added another round of games");
}

async function openLocation(name){
  if(!name) return;
  stopPolling();
  state.loading = true; state.route = "location"; state.locationName = name; render();
  const codes = await getLocationIndex(name);
  let sessions=0, games=0; const recent=[];
  const playerTotals = {};
  for(const code of codes.slice(0,40)){
    const t = await loadTournamentByCode(code);
    if(!t) continue;
    const played = collectAllMatches(t).filter(m=>!m.isBye && m.scoreA!=null && m.scoreB!=null).length;
    sessions++; games+=played;
    recent.push({code:t.code, date:t.date, games:played, format:t.format});
    allTournamentPlayerNames(t).forEach(name2=>{
      const recs = extractPlayerMatchRecords(t, name2);
      if(!recs.length) return;
      if(!playerTotals[name2]) playerTotals[name2] = {name:name2, played:0, wins:0};
      playerTotals[name2].played += recs.length;
      playerTotals[name2].wins += recs.filter(r=>r.won).length;
    });
  }
  const playerList = Object.values(playerTotals);
  const mostActive = playerList.length ? playerList.slice().sort((a,b)=>b.played-a.played)[0] : null;
  const champEligible = playerList.filter(p=>p.played>=3);
  const courtChamp = (champEligible.length ? champEligible : playerList).length
    ? (champEligible.length?champEligible:playerList).slice().sort((a,b)=>(b.wins/b.played)-(a.wins/a.played))[0]
    : null;
  state.loading = false;
  state.locationStats = sessions ? {name, sessions, games, recent, mostActive, courtChamp} : null;
  render();
}

async function openLeaderboard(){
  stopPolling();
  state.loading = true; state.route = "leaderboard"; state.leaderboardScope = state.leaderboardScope || "all"; render();
  const cache = {};
  const ratingCache = {};
  const rowsAll = [], rowsMonth = [];
  const nowMonth = new Date().toISOString().slice(0,7);
  for(const dbP of state.playerDb){
    const codes = await getPlayerIndex(dbP.name);
    let all = {played:0,won:0,lost:0,pf:0,pa:0,tCount:0};
    let month = {played:0,won:0,lost:0,pf:0,pa:0,tCount:0};
    let allRatings = [], monthRatings = [];
    for(const code of codes){
      let t = cache[code];
      if(t===undefined){ t = await loadTournamentByCode(code); cache[code]=t; }
      if(!t) continue;
      const rec = extractPlayerRecord(t, dbP.name);
      if(rec.played===0) continue;
      all.played+=rec.played; all.won+=rec.won; all.lost+=rec.lost; all.pf+=rec.pf; all.pa+=rec.pa; all.tCount++;
      const isThisMonth = t.date && t.date.slice(0,7)===nowMonth;
      if(isThisMonth){
        month.played+=rec.played; month.won+=rec.won; month.lost+=rec.lost; month.pf+=rec.pf; month.pa+=rec.pa; month.tCount++;
      }
      const rating = await computeKitchenRating(t, dbP.name, ratingCache);
      if(rating){ allRatings.push(rating.overall); if(isThisMonth) monthRatings.push(rating.overall); }
    }
    if(all.played) rowsAll.push(leaderboardRow(dbP.name, all, allRatings));
    if(month.played) rowsMonth.push(leaderboardRow(dbP.name, month, monthRatings));
  }
  state.loading = false;
  state.leaderboardRowsAll = rowsAll;
  state.leaderboardRowsMonth = rowsMonth;
  render();
}
function leaderboardRow(name, agg, ratings){
  const avgRating = ratings && ratings.length ? ratings.reduce((a,b)=>a+b,0)/ratings.length : null;
  return { name, sessions:agg.tCount, games:agg.played, wins:agg.won, losses:agg.lost, winRate:agg.played?agg.won/agg.played:0, netPts:agg.played?(agg.pf-agg.pa)/agg.played:0, avgRating };
}
function setLeaderboardSort(key){
  const s = state.leaderboardSort;
  if(s.key===key) s.dir = s.dir==="desc" ? "asc" : "desc";
  else { s.key = key; s.dir = "desc"; }
  render();
}

async function buildPredictionAccuracyReport(){
  const { data, error } = await sbClient.from("kv_store").select("key,value").like("key","tourney-%").limit(300);
  if(error) throw error;
  const tournaments = (data||[]).map(row=>{ try{ return JSON.parse(row.value); }catch(e){ return null; } }).filter(Boolean);
  let matches = [];
  tournaments.forEach(t=>{
    collectAllMatches(t).filter(m=>m.prediction && m.scoreA!=null && m.scoreB!=null && !m.isBye).forEach(m=>matches.push(m));
  });
  if(!matches.length) return null;
  let correct=0, marginErrorSum=0, brierSum=0;
  const byConfidence = {Low:{correct:0,total:0}, Medium:{correct:0,total:0}, High:{correct:0,total:0}};
  const bySignals = {};
  matches.forEach(m=>{
    const p = m.prediction;
    const isCorrect = (p.favored==="A" && m.winner===m.a.id) || (p.favored==="B" && m.winner===m.b.id);
    if(isCorrect) correct++;
    const predictedMargin = p.scoreline.winner - p.scoreline.loser;
    const actualMargin = Math.abs(m.scoreA-m.scoreB);
    marginErrorSum += Math.abs(predictedMargin-actualMargin);
    if(byConfidence[p.confidence]){ byConfidence[p.confidence].total++; if(isCorrect) byConfidence[p.confidence].correct++; }
    const sk = p.signalsUsed;
    if(!bySignals[sk]) bySignals[sk] = {correct:0,total:0};
    bySignals[sk].total++; if(isCorrect) bySignals[sk].correct++;
    const probActualWinner = isCorrect ? p.probFavored : (1-p.probFavored);
    brierSum += Math.pow(1-probActualWinner, 2);
  });
  return {
    total: matches.length, correct,
    accuracy: correct/matches.length,
    avgMarginError: marginErrorSum/matches.length,
    brierScore: brierSum/matches.length,
    byConfidence, bySignals
  };
}

async function computeHeadToHead(nameA, nameB){
  const codes = await getPlayerIndex(nameA);
  let matchups = [];
  for(const code of codes.slice(0,40)){
    const t = await loadTournamentByCode(code);
    if(!t) continue;
    const recs = extractPlayerMatchRecords(t, nameA);
    recs.filter(r=>r.opponents.includes(nameB)).forEach(r=> matchups.push({...r, code:t.code, location:t.location}));
  }
  matchups.sort((a,b)=> a.date===b.date ? a.seq-b.seq : (a.date<b.date?-1:1));
  const winsA = matchups.filter(r=>r.won).length;
  const winsB = matchups.length - winsA;
  const avgMargin = matchups.length ? matchups.reduce((s,r)=>s+(r.scoreFor-r.scoreAgainst),0)/matchups.length : 0;
  const last5 = matchups.slice(-5).reverse();
  return { nameA, nameB, total: matchups.length, winsA, winsB, avgMargin, last5 };
}

function autoPair(balanced){
  const f = state.form;
  const paired = new Set(f.teams.flat());
  let pool = f.players.filter(p=>!paired.has(p.name));
  if(balanced && pool.some(p=>p.dupr)){
    pool = pool.slice().sort((a,b)=>(b.dupr||0)-(a.dupr||0));
    while(pool.length>=2){ const hi=pool.shift(); const lo=pool.pop(); f.teams.push([hi.name, lo.name]); }
  } else {
    pool = shuffle(pool);
    while(pool.length>=2){ const a=pool.pop(); const b=pool.pop(); f.teams.push([a.name,b.name]); }
  }
  render();
}

async function buildTournament(){
  pullFormInputs();
  const f = state.form;
  const loc = f.location==="Other" ? (f.otherLocation.trim()||"Other") : f.location;
  if(!loc){ showToast("Pick a location"); return; }
  if(f.matchType==="doubles"){
    if(f.players.length<4 || f.players.length%2!==0){ showToast("Need an even number of players (min 4) for doubles"); return; }
    if(f.format!=="freeplay"){
      const paired = new Set(f.teams.flat());
      if(f.players.some(p=>!paired.has(p.name))){ showToast("Pair up every player before continuing"); return; }
    }
  } else if(f.matchType==="mixer"){
    if(f.players.length<4){ showToast("Add at least 4 players for rotating-partner doubles"); return; }
  } else {
    if(f.players.length<2){ showToast("Add at least 2 players"); return; }
  }

  state.loading = true; render();

  let participants;
  if(f.matchType==="doubles" && f.format!=="freeplay"){
    participants = f.teams.map((t,i)=>{
      const p1 = f.players.find(p=>p.name===t[0]);
      const p2 = f.players.find(p=>p.name===t[1]);
      const dupr = (p1.dupr && p2.dupr) ? +(((p1.dupr+p2.dupr)/2).toFixed(2)) : null;
      return {id:"team-"+i, label:t[0]+" & "+t[1], players:[t[0],t[1]], dupr};
    });
  } else {
    participants = f.players.map((p,i)=>({id:"p-"+i, label:p.name, dupr:p.dupr}));
  }

  const code = await generateUniqueCode();
  const effectiveFormat = f.matchType==="mixer" ? "mixer" : f.format;
  let tournament = {
    code, location: loc, date: f.date, duration: f.duration, gameLen: f.gameLen, courts: f.courts,
    matchType: f.matchType, format: effectiveFormat, advancePerGroup: f.advancePerGroup, crownChampion: f.crownChampion,
    participants, createdAt: Date.now()
  };

  const targetGames = recommendedMaxMatches(f.duration, f.gameLen, f.courts);

  if(effectiveFormat==="mixer"){
    tournament.mixerRounds = fillMixerToTarget(f.players, targetGames, buildFairnessMap());
    assignCourts(tournament.mixerRounds, f.courts);
  } else if(effectiveFormat==="roundrobin"){
    tournament.matches = fillRoundRobinToTarget(participants, targetGames);
    assignCourtsToFlatMatches(tournament.matches, f.courts);
  } else if(effectiveFormat==="freeplay"){
    tournament.freeplayMode = f.matchType==="singles" ? "singles" : "doubles";
    if(tournament.freeplayMode==="singles"){
      tournament.matches = [];
    } else {
      tournament.mixerRounds = [{round:1, matches:[], sitOut:[]}];
    }
  } else {
    tournament.groups = makeGroups(participants, f.groupSize);
    const perGroupTarget = Math.max(1, Math.round(targetGames / tournament.groups.length));
    tournament.groups.forEach(g=>{ g.matches = fillRoundRobinToTarget(g.participants, perGroupTarget); assignCourtsToFlatMatches(g.matches, f.courts); });
    tournament.bracket = null;
  }

  await saveTournament(tournament);
  await upsertPlayers(f.players);
  await Promise.all(f.players.map(p=>addToPlayerIndex(p.name, code)));
  await addToLocationIndex(loc, code);

  state.loading = false;
  state.tournament = tournament;
  haptic("medium");
  nav("confirm");
}

async function startKnockout(){
  const t = state.tournament;
  const adv = t.advancePerGroup;
  let qualifiers = [];
  t.groups.forEach(g=>{
    const st = computeStandings(g.participants, g.matches);
    st.slice(0, adv).forEach(s=>{
      const full = g.participants.find(p=>p.id===s.id);
      qualifiers.push(full);
    });
  });
  qualifiers = shuffle(qualifiers); // light shuffle so same-group pairs aren't guaranteed to meet immediately after seeding order
  t.bracket = makeBracket(qualifiers);
  assignCourts(t.bracket, t.courts);
  await saveTournament(t);
  haptic("medium");
  render();
}

async function handleRemoveMatch(mid, ctx){
  const t = state.tournament;
  const m = findMatch(t, mid, ctx);
  if(!m) return;
  const hasScore = m.scoreA!=null && m.scoreB!=null;
  if(hasScore){
    if(!confirm("This match already has a score — remove it and its result permanently?")) return;
  }
  if(ctx==="cx"){
    t.crossoverFinal = null;
  } else if(ctx==="grp"){
    for(const g of t.groups){ const idx=g.matches.findIndex(x=>x.id===mid); if(idx>=0){ g.matches.splice(idx,1); break; } }
  } else if(ctx==="mx"){
    for(const r of t.mixerRounds){ const idx=r.matches.findIndex(x=>x.id===mid); if(idx>=0){ r.matches.splice(idx,1); break; } }
  } else {
    const idx = t.matches.findIndex(x=>x.id===mid);
    if(idx>=0) t.matches.splice(idx,1);
  }
  await saveTournament(t);
  haptic("strong");
  state.kitchenRatings = null; state.expandedRating = null; state.matchPredictions = null; state.matchupDifficulty = null;
  render();
  showToast("Match removed");
}

}
function findMatch(t, mid, ctx){
  if(ctx==="cx") return t.crossoverFinal && t.crossoverFinal.id===mid ? t.crossoverFinal : null;
  if(ctx==="ko") { for(const round of t.bracket) { const m=round.find(x=>x.id===mid); if(m) return m; } return null; }
  if(ctx==="grp") { for(const g of t.groups) { const m=g.matches.find(x=>x.id===mid); if(m) return m; } return null; }
  if(ctx==="mx") { for(const r of t.mixerRounds) { const m=r.matches.find(x=>x.id===mid); if(m) return m; } return null; }
  return t.matches.find(x=>x.id===mid);
}

function copyText(text, msg){
  haptic("light");
  navigator.clipboard?.writeText(text).then(()=>showToast(msg)).catch(()=>showToast(text));
}

/* ============================= LIVE POLLING ============================= */
function startPolling(){
  stopPolling();
  state.pollHandle = setInterval(async ()=>{
    if(state.route!=="view" || !state.tCode) return;
    const fresh = await loadTournamentByCode(state.tCode);
    if(fresh && (!state.tournament || fresh.updatedAt !== state.tournament.updatedAt)){
      state.tournament = fresh;
      render();
    }
  }, 4000);
}

/* ============================= INIT ============================= */
async function init(){
  state.playerDb = await loadPlayerDb();
  await checkAdminSession();
  const hash = location.hash;
  if(hash.startsWith("#code=")){
    const code = hash.replace("#code=","").toUpperCase();
    state.loading = true; state.route="view"; render();
    const t = await loadTournamentByCode(code);
    state.loading=false; state.tournament=t; state.tCode=code; state.kitchenRatings=null; state.expandedRating=null; state.editingMatchId=null; state.matchPredictions=null; state.matchupDifficulty=null;
    render();
    if(t) startPolling();
  } else {
    render();
  }
}
init();
</script>
